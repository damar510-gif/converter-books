    logo: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/><path d="M5 8.5h3M5 12h3M16 8.5h3M16 12h3"/>',
    book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
    inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
    archive: '<path d="M21 8v13H3V8"/><rect x="1" y="3" width="22" height="5" rx="1"/><path d="M10 12h4"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
    refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
    scale: '<path d="M12 3v17M6 20h12M4 7h16"/><path d="m4 7-3 7a3 3 0 0 0 6 0z"/><path d="m20 7-3 7a3 3 0 0 0 6 0z"/>',
    theme: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>',
    keys: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
    folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
    alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    checks: '<path d="M17 6 6 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    back: '<path d="M5 12h14M12 5l7 7-7 7"/>',
    next: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
    external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    play: '<path d="M6 4l14 8-14 8z"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    maximize: '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
    terminal: '<path d="m4 17 6-6-6-6M12 19h8"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'
  };

  function svg(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function icon(name) {
    var s = el('span', 'ic');
    s.innerHTML = svg(name);
    return s;
  }

  // A button: its label is kept in .lab so it can change without losing the icon.
  function button(cls, text, onClick, ic, key) {
    var b = el('button', 'btn' + (cls ? ' ' + cls : ''));
    b.type = 'button';
    if (ic) b.appendChild(icon(ic));
    b.lab = b.appendChild(el('span', '', text));
    if (key) b.appendChild(el('kbd', '', key));
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }

  function setLabel(b, text) { if (b.lab) b.lab.textContent = text; else b.textContent = text; }

  function link(href, text, cls, ic) {
    var a = el('a', cls || '');
    if (ic) a.appendChild(icon(ic));
    a.appendChild(el('span', '', text));
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  // A state: a dot and a word, coloured by kind (run, ok, hold, gold, bad, wait).
  function st(kind, text) {
    var p = el('span', 'st is-' + kind);
    p.appendChild(el('i'));
    p.appendChild(el('span', '', text));
    return p;
  }

  function note(kind, text) {
    var d = el('div', 'note is-' + kind);
    d.appendChild(icon(kind === 'bad' ? 'alert' : kind === 'ok' ? 'check' : 'info'));
    d.p = d.appendChild(el('p', '', text));
    return d;
  }

  function cardHead(ic, title, end) {
    var h = el('div', 'ch');
    var c = el('span', 'ch-ic');
    c.appendChild(icon(ic));
    h.appendChild(c);
    h.appendChild(el('h2', '', title));
    if (end) {
      end.className += ' end';
      h.appendChild(end);
    }
    return h;
  }

  function meter(done, total) {
    var m = el('div', 'meter');
    var fill = el('i');
    fill.style.width = pct(done, total) + '%';
    m.appendChild(fill);
    return m;
  }

  function pct(done, total) { return total ? Math.min(100, Math.round(100 * done / total)) : 0; }

  // Arabic counted nouns: 1 دقيقة، 2 دقيقتان، 3-10 دقائق، 11+ دقيقة.
  function count(n, one, two, few, many) {
    if (n === 1) return one;
    if (n === 2) return two;
    if (n >= 3 && n <= 10) return n + ' ' + few;
    return n + ' ' + many;
  }

  function duration(minutes) {
    if (minutes < 1) return 'أقل من دقيقة';
    if (minutes < 60) return count(minutes, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');
    var h = Math.floor(minutes / 60), m = minutes % 60;
    var text = count(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة');
    return m ? text + ' و' + count(m, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة') : text;
  }

  function when(iso, timeOnly) {
    if (!iso) return '';
    var d = new Date(iso);
    try {
      var opts = { calendar: 'gregory', numberingSystem: 'latn', hour: '2-digit', minute: '2-digit' };
      if (!timeOnly) { opts.day = 'numeric'; opts.month = 'long'; }
      return d.toLocaleString('ar', opts);
    } catch (e) {
      return iso.replace('T', ' ').slice(0, 16);
    }
  }

  // Today, in the Gregorian and the Umm al-Qura calendars.
  function today(iso) {
    var d = iso ? new Date(iso) : new Date();
    var out = [];
    try {
      out.push(d.toLocaleDateString('ar', { calendar: 'gregory', numberingSystem: 'latn', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
      out.push(d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }));
    } catch (e) { /* the date alone is enough */ }
    return out.join(' · ');
  }

  function minutesSince(iso, nowIso) {
    return Math.max(0, Math.floor((Date.parse(nowIso) - Date.parse(iso)) / 60000));
  }

  function parse(text) {
    try { return JSON.parse(text) || { ok: false }; } catch (e) { return { ok: false, error: 'رد غير مفهوم' }; }
  }

  function errText(e) { return String(e && e.message ? e.message : e || 'خطأ غير معروف'); }

  // ------------------------------------------------------------------------
  // Messages: one at a time, at the bottom of the screen.
  // ------------------------------------------------------------------------
  var TOAST = null;
  var TOAST_T = 0;

  function setMsg(text, kind) {
    if (TOAST_T) { clearTimeout(TOAST_T); TOAST_T = 0; }
    if (!text) return hideToast();
    kind = kind || (/^تعذّر/.test(text) ? 'bad' : /…$/.test(text) ? 'busy' : 'ok');
    if (!TOAST) {
      TOAST = el('div', 'toast');
      document.getElementById('toasts').appendChild(TOAST);
    }
    TOAST.className = 'toast is-' + kind;
    TOAST.textContent = '';
    TOAST.appendChild(icon(kind === 'bad' ? 'alert' : kind === 'busy' ? 'refresh' : kind === 'info' ? 'info' : 'check'));
    TOAST.appendChild(el('p', '', text));
    var x = button('btn-quiet x', '', hideToast, 'x');
    x.setAttribute('aria-label', 'إغلاق');
    TOAST.appendChild(x);
    if (kind !== 'busy') TOAST_T = setTimeout(hideToast, kind === 'bad' ? 15000 : 7000);
  }

  function hideToast() {
    if (TOAST && TOAST.parentNode) TOAST.parentNode.removeChild(TOAST);
    TOAST = null;
  }

  // ------------------------------------------------------------------------
  // The status page.
  // ------------------------------------------------------------------------
  function render(s) {
    LAST = s;
    var now = document.getElementById('now');
    var waiting = document.getElementById('queue');
    var foot = document.getElementById('foot');
    now.textContent = '';
    waiting.textContent = '';
    document.getElementById('recent').textContent = '';
    foot.textContent = '';
    document.getElementById('notices').textContent = '';
    document.getElementById('today').textContent = today(s && s.now);
    renderSync(s);

    if (!s || !s.ok) {
      var bad = note('bad', 'تعذّر قراءة الحالة: ' + ((s && s.error) || 'خطأ غير معروف'));
      bad.p.appendChild(document.createTextNode(' '));
      bad.p.appendChild(button('btn-sm', 'أعد المحاولة', function () { refresh(); }, 'refresh'));
      now.appendChild(bad);
      return;
    }

    renderNotices(s);
    renderNow(s);
    renderQueue(s);
    renderReviews(s);
    renderBoxes(s);
    renderRecent(s);
    renderHelper(s);
    renderFoot(s);
    renderFigs(s);
    renderNav(s);
  }

  // When the script last checked the folders: green within its 10 minutes, then gold, then red.
  function renderSync(s) {
    var kind = 'bad', text = 'تعذّر قراءة الحالة';
    if (s && s.ok) {
      if (!s.lastTick) {
        text = 'لم يجرِ أي فحص بعد';
      } else {
        var m = minutesSince(s.lastTick, s.now);
        kind = m <= 15 ? 'ok' : m <= 60 ? 'hold' : 'bad';
        text = 'آخر فحص: قبل ' + duration(m);
      }
    }
    ['sub', 'side-sync'].forEach(function (id) {
      var box = document.getElementById(id);
      box.textContent = '';
      box.appendChild(el('span', 'dot is-' + (BUSY ? 'busy' : kind)));
      box.appendChild(el('span', '', text));
    });
  }

  function setBusy(on) {
    BUSY = on;
    renderSync(LAST);
  }

  function renderNotices(s) {
    var box = document.getElementById('notices');
    if (!s.setUp) box.appendChild(note('hold', 'الإعداد لم يكتمل. شغّل الدالة setup من المحرر (الخطوة 4 في دليل الإعداد).'));
    if (!s.hasToken) box.appendChild(note('bad', 'رمز GitHub غير موجود. أضف GITHUB_TOKEN (الخطوة 3 في دليل الإعداد).'));
    var days = tokenDays(s);
    if (days !== null && days <= 14) {
      box.appendChild(note(days <= 3 ? 'bad' : 'hold', 'صلاحية رمز GitHub تنتهي ' + (days < 1 ? 'اليوم' : 'بعد ' +
        count(days, 'يوم واحد', 'يومين', 'أيام', 'يوماً')) + ' (' + when(s.tokenExpires) + '). جدّده قريباً (الخطوة 7 في الدليل).'));
    }
  }

  function tokenDays(s) {
    if (!s.tokenExpires) return null;
    return Math.max(0, Math.floor((Date.parse(s.tokenExpires) - Date.parse(s.now)) / 86400000));
  }

  // The active book's state, in the words used everywhere on the page.
  function activeState(s, a) {
    if (a.stage === 'queued') return { kind: 'wait', label: 'ينتظر البدء' };
    if (a.paused && helperOn(s, a)) return { kind: 'run', label: 'نماذجك تعمل عليه' };
    if (a.paused) return { kind: 'hold', label: 'متوقف حتى الغد' };
    return { kind: 'run', label: 'يُحوَّل الآن' };
  }

  // The helper's models finish pages between runs; the run adds them to the book later.
  function activePages(s, a) {
    var hp = helperProgress(s, a);
    if (hp && hp.finished > a.pagesDone) return { done: hp.finished, total: hp.need, helper: true };
    return { done: a.pagesDone, total: a.pagesTotal, helper: false };
  }

  // What the helper's models have finished of a book: {need, finished}, or null.
  function helperProgress(s, a) {
    var p = s.helper && s.helper.progress && a.fileId ? s.helper.progress[a.fileId] : null;
    return p && p.need ? p : null;
  }

  // The helper's models are working on the book now: pages left, and a model at work.
  function helperOn(s, a) {
    var p = helperProgress(s, a), h = s.helper || {};
    if (!p || p.finished >= p.need || !h.connected) return false;
    return working(h) > 0;
  }

  function working(h) {
    var n = 0;
    if (h && h.chips) Object.keys(h.chips).forEach(function (id) { if (h.chips[id].state === 'working') n++; });
    return n;
  }

  function resting(h) {
    var n = 0;
    if (h && h.chips) Object.keys(h.chips).forEach(function (id) { if (/^(exhausted|failing)$/.test(h.chips[id].state)) n++; });
    return n;
  }

  function places(s) {
    var n = 0;
    (s.reviews || []).forEach(function (b) { if (b.note !== 'no-data') n += b.open || 0; });
    return n;
  }

  // The book being converted.
  function renderNow(s) {
    var box = document.getElementById('now');
    var a = s.active;
    var top = el('div', 'hero-top');
    var eb = el('div', 'hero-eb');
    eb.appendChild(icon('book'));
    eb.appendChild(el('span', '', 'الآن'));
    top.appendChild(eb);
    box.appendChild(top);
    if (!a) {
      box.appendChild(el('div', 'hero-title', 'لا يوجد كتاب قيد التحويل.'));
      box.appendChild(el('div', 'hero-lines', s.queued ? 'يبدأ الكتاب التالي في الفحص القادم.'
        : 'ضع ملف PDF أو DOCX أو TXT في مجلد «1- جديد»، فيبدأ تحويله خلال عشر دقائق.'));
      if (s.links && s.links.inbox) {
        var acts = el('div', 'hero-acts');
        acts.appendChild(link(s.links.inbox, 'افتح «1- جديد»', 'btn btn-sm', 'folder'));
        box.appendChild(acts);
      }
      return;
    }
    var state = activeState(s, a);
    top.appendChild(st(state.kind, state.label));
    box.appendChild(el('div', 'hero-title', '«' + a.title + '»'));
    var lines = el('div', 'hero-lines');
    var line = function (t) { lines.appendChild(el('div', '', t)); };
    if (a.stage === 'queued') {
      line('ينتظر بدء التحويل.');
    } else if (a.paused && helperOn(s, a)) {
      line('نماذجك على جهازك تعمل عليه الآن. النموذج المجاني وحده متوقف حتى الغد (انتهت حصته).');
      line('يعود النموذج المجاني نحو ' + when(a.resumeAt) + '، أو قبل ذلك حين تنهي نماذجك صفحاتها. ما أُنجز محفوظ.');
    } else if (a.paused) {
      line('متوقف حتى الغد: انتهت حصة القراءة المجانية لهذا اليوم.');
      line('يكمل تلقائياً نحو ' + when(a.resumeAt) + '. ما أُنجز محفوظ.');
    } else {
      line('قيد التحويل منذ ' + duration(a.minutes) + (a.attempts > 1 ? ' (المحاولة رقم ' + a.attempts + ')' : '') + '.');
    }
    box.appendChild(lines);
    if (a.stage === 'queued' && a.lastError) {
      box.appendChild(note('hold', 'تعذّر بدء التحويل على GitHub، وسأحاول مرة أخرى تلقائياً. (' + a.lastError + ')'));
    }

    var p = activePages(s, a);
    if (p.total) {
      var prog = el('div', 'prog');
      var n = el('div', 'prog-n');
      n.appendChild(el('b', '', String(p.done)));
      n.appendChild(el('span', '', 'من ' + p.total + ' صفحة'));
      n.appendChild(el('em', '', pct(p.done, p.total) + '%'));
      prog.appendChild(n);
      prog.appendChild(meter(p.done, p.total));
      prog.appendChild(el('div', 'prog-s', p.helper
        ? 'أنجزت نماذجك ' + p.done + ' من ' + p.total + ' صفحة، وتُضاف إلى الكتاب في التشغيل القادم.'
        : 'أُنجزت ' + p.done + ' من ' + p.total + ' صفحة حتى آخر توقف.'));
      box.appendChild(prog);
    }

    var facts = el('dl', 'facts');
    var any = false;
    var fact = function (k, v) {
      facts.appendChild(el('dt', '', k));
      facts.appendChild(el('dd', '', v));
      any = true;
    };
    if (a.since && a.stage !== 'queued') fact('آخر تشغيل', when(a.since));
    if (a.attempts > 1) fact('المحاولة', 'رقم ' + a.attempts);
    if (a.paused) fact('يعود المجاني', when(a.resumeAt));
    if (p.helper && a.pagesTotal) fact('في الكتاب الآن', a.pagesDone + ' من ' + a.pagesTotal + ' صفحة');
    if (any) box.appendChild(facts);
  }

  // Books waiting: in «1- جديد», and parked in «2- قيد التحويل».
  function renderQueue(s) {
    var box = document.getElementById('queue');
    var parked = s.parked || [];
    var total = s.queued + parked.length;
    box.appendChild(cardHead('inbox', 'في الانتظار', el('span', 'count', total ? String(total) : '')));
    box.appendChild(el('div', 'sub', s.queued
      ? count(s.queued, 'كتاب واحد', 'كتابان', 'كتب', 'كتاباً') + ' في «1- جديد»' + (s.queueNames && s.queueNames.length ? '، تبدأ بهذا الترتيب:' : '.')
      : 'لا توجد كتب في «1- جديد».'));
    if (s.queueNames && s.queueNames.length) {
      var names = el('ol', 'ol');
      s.queueNames.forEach(function (n) { names.appendChild(el('li', '', n)); });
      if (s.queued > s.queueNames.length) names.appendChild(el('li', 'more', 'وكتب أخرى'));
      box.appendChild(names);
    }
    if (s.uploading) {
      box.appendChild(el('div', 'sub', 'منها ' + s.uploading + ' ما زال يُرفع أو أُضيف قبل دقائق.'));
    }
    if (s.unsupported && s.unsupported.length) {
      box.appendChild(note('hold', 'ملفات لن تُحوَّل لأن نوعها غير مدعوم (المدعوم: PDF و DOCX و TXT): ' + s.unsupported.join('، ')));
    }
    if (!parked.length) return;
    var h3 = el('div', 'h3');
    h3.appendChild(icon('clock'));
    h3.appendChild(el('span', '', 'ينتظر في «2- قيد التحويل» دون أن يوقف غيره'));
    box.appendChild(h3);
    var list = el('ul', 'rows');
    parked.forEach(function (p) {
      var li = el('li', 'rw');
      var busy = p.stage === 'helper' && s.helper && s.helper.connected && working(s.helper) > 0;
      var ic = el('div', 'rw-ic is-' + (busy ? 'ok' : 'hold'));
      ic.appendChild(icon(p.stage === 'helper' ? 'cpu' : p.stage === 'readerWait' ? 'book' : 'scale'));
      li.appendChild(ic);
      var b = el('div', 'rw-b');
      b.appendChild(el('div', 'rw-t', '«' + p.title + '»'));
      b.appendChild(el('div', 'rw-m', p.stage === 'helper'
        ? 'ينتظر نماذجك على الجهاز' + (p.need ? ': أنهت ' + p.finished + ' من ' + p.need + ' صفحة.' : '.')
        : p.stage === 'readerWait' ? 'ينتظر تجدد رصيد القارئ الثاني، ثم يكمل قبل غيره.'
        : 'ينتظر الحكّام حتى يتجدد رصيدهم.'));
      li.appendChild(b);
      li.appendChild(st(busy ? 'run' : 'hold', busy ? 'نماذجك تعمل عليه'
        : p.stage === 'helper' ? 'ينتظر نماذجك' : p.stage === 'readerWait' ? 'ينتظر القارئ الثاني' : 'ينتظر الحكّام'));
      if (p.stage === 'helper' && p.need) li.appendChild(meter(p.finished, p.need));
      list.appendChild(li);
    });
    box.appendChild(list);
  }

  // Finished books.
  function renderRecent(s) {
    var list = document.getElementById('recent');
    document.getElementById('recent-n').textContent = s.recent.length ? String(s.recent.length) : '';
    if (!s.recent.length) list.appendChild(el('li', 'rw is-empty', 'لا شيء بعد.'));
    var open = {};
    (s.reviews || []).forEach(function (b) { if (b.open && b.note !== 'no-data') open[b.fileId] = b.open; });
    s.recent.forEach(function (j) {
      var li = el('li', 'rw');
      var kind = j.stage === 'problem' ? 'bad' : j.incomplete ? 'hold' : j.final ? 'ok' : 'gold';
      var ic = el('div', 'rw-ic is-' + kind);
      ic.appendChild(icon(j.stage === 'problem' ? 'alert' : j.final ? 'check' : 'book'));
      li.appendChild(ic);
      var b = el('div', 'rw-b');
      b.appendChild(el('div', 'rw-t', j.title));
      var meta = [when(j.finishedAt)];
      if (j.stage !== 'problem' && j.unsure > 0) {
        meta.push(count(j.unsure, 'صفحة مشكوك فيها', 'صفحتان مشكوك فيهما', 'صفحات مشكوك فيها', 'صفحة مشكوك فيها'));
      }
      if (j.reason) meta.push(j.reason);
      b.appendChild(el('div', 'rw-m', meta.join(' · ')));
      li.appendChild(b);
      var acts = el('div', 'rw-a');
      acts.appendChild(st(kind, j.stage === 'problem' ? 'مشكلة' : j.incomplete ? 'جاهز، فيه صفحات ناقصة' : j.final ? 'مكتمل' : 'جاهز'));
      if (j.url) acts.appendChild(link(j.url, j.stage === 'problem' ? 'الملف' : 'افتح الكتاب', 'btn btn-sm', 'external'));
      var n = j.fileId && open[j.fileId];
      if (n) {
        acts.appendChild(button('btn-sm btn-gold', 'راجِع ' + count(n, 'موضعاً واحداً', 'موضعين', 'مواضع', 'موضعاً'),
          function () { openReview(j.fileId); }, 'pen'));
      }
      li.appendChild(acts);
      list.appendChild(li);
    });
  }

  function renderFoot(s) {
    var foot = document.getElementById('foot');
    var add = function (href, text) { if (href) foot.appendChild(link(href, text, 'fchip', 'folder')); };
    add(s.links.inbox, '1- جديد');
    add(s.links.ready, '3- جاهز');
    add(s.links.problem, '5- مشكلة');
    add(s.links.root, 'كل المجلدات');
    var words = [];
    if (s.tokenExpires) words.push('صلاحية رمز GitHub حتى ' + when(s.tokenExpires) + '.');
    words.push('تتحدّث الصفحة وحدها كل دقيقتين.');
    foot.appendChild(el('div', 'foot-l', words.join(' ')));
  }

  // The day at a glance: each number opens its section.
  function renderFigs(s) {
    var box = document.getElementById('figs');
    box.textContent = '';
    var add = function (target, kind, ic, label, value, unit, small) {
      var b = el('button', 'fig' + (kind ? ' is-' + kind : ''));
      b.type = 'button';
      var l = el('span', 'fig-l');
      l.appendChild(icon(ic));
      l.appendChild(el('span', '', label));
      b.appendChild(l);
      var v = el('span', 'fig-v', value);
      if (unit) v.appendChild(el('small', '', unit));
      b.appendChild(v);
      b.appendChild(el('span', 'fig-s', small));
      b.addEventListener('click', function () { jump(target); });
      box.appendChild(b);
    };
    var a = s.active;
    if (a) {
      var state = activeState(s, a), p = activePages(s, a);
      add('now', state.kind, 'book', 'الكتاب الحالي', p.total ? String(pct(p.done, p.total)) : '—', p.total ? '%' : '',
        state.label + (p.total ? ' · ' + p.done + ' من ' + p.total : ''));
    } else {
      add('now', '', 'book', 'الكتاب الحالي', '—', '', 'لا يوجد تحويل الآن');
    }
    var parked = (s.parked || []).length;
    add('queue', '', 'inbox', 'في الانتظار', String(s.queued + parked), '',
      'في «1- جديد»: ' + s.queued + (parked ? ' · مركون: ' + parked : ''));
    var n = places(s);
    var books = (s.reviews || []).filter(function (b) { return b.open && b.note !== 'no-data'; }).length;
    add(n ? 'reviews' : 'recent-card', n ? 'hold' : '', 'pen', 'للمراجعة', String(n), '',
      n ? 'في ' + count(books, 'كتاب واحد', 'كتابين', 'كتب', 'كتاباً') : 'لا مواضع تنتظرك');
    var h = s.helper;
    if (h) {
      var w = working(h), r = resting(h);
      add(h.seen ? 'boxes' : 'helper', !h.seen ? '' : h.connected ? (w ? 'run' : 'ok') : 'bad', 'cpu', 'نماذجك تعمل', String(w), '',
        (h.connected ? 'جهازك متصل' : h.seen ? 'جهازك غير متصل' : 'المساعد غير مثبّت') + (r ? ' · ' + count(r, 'نموذج يرتاح', 'نموذجان يرتاحان', 'نماذج ترتاح', 'نموذجاً يرتاح') : ''));
    }
    add('recent-card', '', 'archive', 'آخر الكتب', String(s.recent.length), '',
      s.recent.length ? 'آخرها ' + when(s.recent[0].finishedAt) : 'لا شيء بعد');
  }

  // ------------------------------------------------------------------------
  // The sections: in the side bar on a computer, as links at the top on a phone.
  // ------------------------------------------------------------------------
  var NAV = [];
  var NAV_EL = [];

  function renderNav(s) {
    var h = s.helper;
    var a = s.active;
    var p = a ? activePages(s, a) : null;
    var n = places(s);
    var w = working(h);
    var items = [
      { id: 'now', name: 'الآن', ic: 'book', n: p && p.total ? pct(p.done, p.total) + '%' : '' },
      { id: 'queue', name: 'في الانتظار', short: 'الانتظار', ic: 'inbox', n: s.queued + (s.parked || []).length || '' },
      { id: 'reviews', name: 'مراجعة المشكوك فيه', short: 'المراجعة', ic: 'pen', n: n || '', hold: n > 0, off: !(s.reviews || []).length },
      { id: 'boxes', name: 'نماذجك على الجهاز', short: 'نماذجك', ic: 'cpu', n: w || '', off: !h || !h.seen },
      { id: 'recent-card', name: 'آخر الكتب', ic: 'archive', n: s.recent.length || '' },
      { id: 'helper', name: 'المساعد على جهازك', short: 'المساعد', ic: 'monitor', dot: h && h.seen ? (h.connected ? 'ok' : 'bad') : '', off: !h }
    ].filter(function (x) { return !x.off; });
    NAV = items.map(function (x) { return x.id; });
    NAV_EL = [];
    var side = document.getElementById('side-nav');
    var top = document.getElementById('jump');
    side.textContent = '';
    top.textContent = '';
    items.forEach(function (x) {
      var b = el('button', 'nav-i');
      b.type = 'button';
      b.appendChild(icon(x.ic));
      b.appendChild(el('span', '', x.name));
      if (x.dot) b.appendChild(el('span', 'nav-n')).appendChild(el('span', 'dot is-' + x.dot));
      else if (x.n !== '') b.appendChild(el('span', 'nav-n' + (x.hold ? ' is-hold' : ''), String(x.n)));
      b.addEventListener('click', function () { jump(x.id); });
      side.appendChild(b);
      NAV_EL.push({ id: x.id, node: b, base: 'nav-i' });

      var c = el('button', 'jchip');
      c.type = 'button';
      c.appendChild(icon(x.ic));
      c.appendChild(el('span', '', x.short || x.name));
      if (x.dot) c.appendChild(el('span', 'dot is-' + x.dot));
      else if (x.n !== '' && x.id !== 'now') c.appendChild(el('em', '', String(x.n)));
      c.addEventListener('click', function () { jump(x.id); });
      top.appendChild(c);
      NAV_EL.push({ id: x.id, node: c, base: 'jchip' });
    });
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(spy);
  }

  function jump(id) {
    var t = document.getElementById(id);
    if (t && !t.hidden && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // The section on screen is marked in the side bar and the links.
  var SPY = 0;
  function spy() {
    SPY = 0;
    var cur = NAV[0] || '';
    NAV.forEach(function (id) {
      var t = document.getElementById(id);
      if (t && !t.hidden && t.getBoundingClientRect().top < 170) cur = id;
    });
    NAV_EL.forEach(function (x) { x.node.className = x.base + (x.id === cur ? ' is-on' : ''); });
  }
  document.addEventListener('scroll', function () {
    if (!SPY && typeof requestAnimationFrame === 'function') SPY = requestAnimationFrame(spy);
  }, { passive: true });

  // ------------------------------------------------------------------------
  // Refresh, check now, judges now.
  // ------------------------------------------------------------------------
  // One getStatus at a time; what waits for it runs when it is back.
  var REFRESHING = null;

  function refresh(after) {
    if (REFRESHING) {
      if (after) REFRESHING.push(after);
      return;
    }
    var waiting = REFRESHING = after ? [after] : [];
    setBusy(true);
    google.script.run
      .withSuccessHandler(function (text) {
        REFRESHING = null;
        BUSY = false;
        render(parse(text));
        waiting.forEach(function (f) { f(); });
      })
      .withFailureHandler(function (err) {
        REFRESHING = null;
        setBusy(false);
        waiting.forEach(function (f) { f(); });
        setMsg('تعذّر التحديث: ' + errText(err));
      })
      .getStatus();
  }

  document.getElementById('check').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    setBusy(true);
    setMsg('جارٍ الفحص…');
    google.script.run
      .withSuccessHandler(function (result) {
        refresh(function () {
          btn.disabled = false;
          setMsg(result === 'busy' ? 'يوجد فحص يعمل الآن، حدّثت الصفحة.' : 'تم الفحص.', result === 'busy' ? 'info' : 'ok');
        });
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        setBusy(false);
        setMsg('تعذّر الفحص: ' + errText(err));
      })
      .tick();
  });

  // Unsure pages go to the judges today, using what is left of their daily quota.
  document.getElementById('judge').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    setMsg('جارٍ الطلب…');
    google.script.run
      .withSuccessHandler(function (result) {
        refresh(function () {
          btn.disabled = false;
          setMsg(result === 'busy' ? 'يوجد فحص يعمل الآن، أعد المحاولة بعد دقيقة.'
            : result === 'nothing to judge' ? 'لا يوجد كتاب فيه صفحات مشكوك فيها تنتظر الحكّام.'
            : /(judging|refining) [\w-]+: dispatched/.test(result) ? 'بدأت مراجعة الحكّام. تصلك رسالة حين تنتهي الجولة.'
            : 'تبدأ المراجعة بعد الكتاب الجاري تحويله أو الكتاب الجديد، تلقائياً.',
            /dispatched/.test(result) ? 'ok' : 'info');
        });
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        setMsg('تعذّر الطلب: ' + errText(err));
      })
      .judgeNow();
  });

  // Keep the page current while it is open (not during a review or while typing), and when the user comes back to it.
  function typing() {
    var t = document.activeElement;
    return !!t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName || '');
  }
  setInterval(function () { if (!document.hidden && !RV && !typing()) refresh(); }, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !RV) refresh(); });

  // ------------------------------------------------------------------------
  // Review by hand: one place at a time, its page image zoomed on it, and two
  // big buttons. Answers are saved as they are given (one call at a time); "send"
  // asks for the book to be rebuilt with them.
  // ------------------------------------------------------------------------
  var RV = null;
  var RETRY = [3000, 10000, 30000];
  var HELP = ' إن تكرر الخطأ فافتح الرابط في نافذة خاصة بحسابك وحده.';

  function setRvMsg(text, bad) {
    var m = document.getElementById('rv-msg');
    m.textContent = text || '';
    m.className = bad ? 'is-bad' : '';
  }

  function show(which) {
    document.getElementById('home').hidden = which !== 'home';
    document.getElementById('review').hidden = which !== 'review';
    document.getElementById('app').className = 'app' + (which === 'review' ? ' is-review' : '');
    document.getElementById('toasts').className = 'toasts' + (which === 'review' ? ' is-high' : '');
    if (typeof scrollTo === 'function') scrollTo(0, 0);
  }

  function remember(rv) {
    // A copy of what is not saved yet, in case the page is closed or the network drops.
    try {
      var all = {};
      Object.keys(rv.saving || {}).forEach(function (k) { all[k] = rv.saving[k]; });
      Object.keys(rv.outbox).forEach(function (k) { all[k] = rv.outbox[k]; });
      localStorage.setItem('rv-' + rv.fileId, JSON.stringify(all));
    } catch (e) { /* private mode: nothing kept */ }
  }

  function remembered(fileId) {
    try { return JSON.parse(localStorage.getItem('rv-' + fileId) || '{}') || {}; } catch (e) { return {}; }
  }

  function renderReviews(s) {
    var box = document.getElementById('reviews');
    box.textContent = '';
    var list = (s && s.reviews) || [];
    box.hidden = !list.length;
    if (!list.length) return;
    var n = places(s);
    box.appendChild(cardHead('pen', 'مراجعة المشكوك فيه', el('span', 'count', n ? count(n, 'موضع واحد', 'موضعان', 'مواضع', 'موضعاً') : '')));
    box.appendChild(el('div', 'sub', 'مواضع لم تقدر النماذج على حسمها: ترى كل موضع على صورة الصفحة وتجيب بزر.'));
    var ul = el('ul', 'rows');
    list.forEach(function (b) {
      var li = el('li', 'rw');
      var ic = el('div', 'rw-ic' + (b.open ? ' is-hold' : ''));
      ic.appendChild(icon(b.pending ? 'refresh' : 'pen'));
      li.appendChild(ic);
      var body = el('div', 'rw-b');
      body.appendChild(el('div', 'rw-t', b.title));
      if (b.pending) body.appendChild(el('div', 'rw-m', 'أُرسلت إجاباتك، ويُحدَّث الكتاب قريباً وتصلك رسالة.'));
      else if (b.saved) body.appendChild(el('div', 'rw-m', count(b.saved, 'إجابة محفوظة', 'إجابتان محفوظتان', 'إجابات محفوظة', 'إجابة محفوظة') + ' لم تُرسل بعد.'));
      if (b.note === 'orig-gone') body.appendChild(note('hold', 'أعِد الملف الأصلي إلى «4- الأصل» ثم اضغط «أرسل الآن».'));
      if (b.note === 'no-data') body.appendChild(note('hold', 'هذا الكتاب أقدم من خاصية المراجعة.'));
      if (b.note === 'failed') body.appendChild(note('bad', 'تعذّر تطبيق إجاباتك. اضغط «أرسل الآن» للمحاولة مرة أخرى.'));
      li.appendChild(body);
      var acts = el('div', 'rw-a');
      if (b.pending) acts.appendChild(st('run', 'يُحدَّث'));
      if (b.open && b.note !== 'no-data') {
        acts.appendChild(button('btn-sm btn-gold', 'راجِع ' + count(b.open, 'موضعاً واحداً', 'موضعين', 'مواضع', 'موضعاً'),
          function () { openReview(b.fileId); }, 'pen'));
      }
      if (!b.pending && (b.saved > 0 || b.note === 'orig-gone' || b.note === 'failed')) {
        var send = button('btn-sm', 'أرسل الآن' + (b.saved ? ' (' + b.saved + ')' : ''), function () { sendReview(b.fileId, send); }, 'check');
        acts.appendChild(send);
      }
      li.appendChild(acts);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  function openReview(fileId) {
    RV = null;
    show('review');
    document.getElementById('rv-title').textContent = '';
    document.getElementById('rv-count').textContent = '';
    document.getElementById('rv-body').textContent = '';
    document.getElementById('rv-saving').textContent = '';
    setRvMsg('جارٍ التحميل…');
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        if (!r.ok) return setRvMsg('تعذّر فتح المراجعة: ' + (r.error || '') + '.' + HELP, true);
        start(fileId, r);
      })
      .withFailureHandler(function (err) { setRvMsg('تعذّر فتح المراجعة: ' + errText(err) + '.' + HELP, true); })
      .getReview(fileId);
  }

  function start(fileId, r) {
    var flat = [];
    r.pages.forEach(function (p) { p.items.forEach(function (it) { flat.push({ page: p, item: it }); }); });
    RV = { fileId: fileId, title: r.title, flat: flat, at: 0, done: {}, images: {}, waiting: {},
      outbox: {}, saving: null, tries: 0, saved: r.saved || 0, sent: r.sent || r.running, keys: null, editing: null };
    // Answers not saved last time (the page was closed or offline) go out now.
    var left = remembered(fileId);
    Object.keys(left).forEach(function (id) { RV.outbox[id] = left[id]; RV.done[id] = left[id].verdict; });
    document.getElementById('rv-title').textContent = '«' + r.title + '»';
    setRvMsg(r.sent || r.running ? 'أُرسلت إجابات سابقة لهذا الكتاب وهو قيد التحديث؛ يمكنك متابعة المراجعة.' : '');
    if (flat.length) showItem(); else finished();
    flush(RV);
  }

  function plain(t) {
    return String(t || '').replace(/^#+\s*/gm, '').replace(/^\|\s*/gm, '').replace(/\[\^([^\]\s]+)\]:?/g, '($1)')
      .replace(/\s+/g, ' ');
  }

  function short(t, n) {
    t = plain(t).trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  function isGap(it) { return it.kind === 'missing' && !String(it.core).trim(); }

  function showItem() {
    var cur = RV.flat[RV.at];
    var it = cur.item, page = cur.page;
    var body = document.getElementById('rv-body');
    body.textContent = '';
    RV.editing = null;
    document.getElementById('rv-count').textContent =
      'الموضع ' + (RV.at + 1) + ' من ' + RV.flat.length + ' · صفحة ' + page.page + ' من الأصل';
    document.getElementById('rv-bar').style.width = Math.round(100 * RV.at / RV.flat.length) + '%';
    var grid = el('div', 'rv-grid');

    // The page image, zoomed on the place.
    var pic = el('div', 'rv-pic');
    var zoom = el('div', 'zoom');
    zoom.dir = 'ltr';
    var holder = el('div', 'page');
    var img = el('img');
    img.alt = 'صفحة ' + page.page;
    holder.appendChild(img);
    zoom.appendChild(holder);
    pic.appendChild(zoom);
    var under = el('div', 'pic-u');
    var hint = el('span', '', page.img ? 'تحميل الصورة…' : 'لا توجد صورة لهذه الصفحة.');
    under.appendChild(hint);
    var full = false;
    var whole = button('btn-sm btn-quiet', 'الصفحة كاملة', function () {
      full = !full;
      setLabel(whole, full ? 'كبّر على الموضع' : 'الصفحة كاملة');
      view(zoom, holder, page, it, full);
    }, 'maximize', 'Z');
    if (it.located) under.appendChild(whole);
    pic.appendChild(under);
    grid.appendChild(pic);
    if (page.img) {
      image(page.img, function (src) {
        if (!RV || RV.flat[RV.at] !== cur) return;
        if (!src) { hint.textContent = 'تعذّر تحميل الصورة.'; return; }
        img.src = src;
        hint.textContent = it.kind === 'page' ? 'لم أجد موضعاً محدداً في هذه الصفحة؛ قارنها كلها بالأصل.'
          : it.located ? 'الموضع في المربع الأحمر.' : 'لم أحدد الموضع بدقة: ابحث عنه في الصفحة.';
        view(zoom, holder, page, it, full);
      });
    }
    prefetch();

    // What was read, and the answers.
    var side = el('div', 'rv-side');
    var head = el('div', 'h3');
    head.appendChild(icon('book'));
    head.appendChild(el('span', '', 'ما قرأه البرنامج'));
    if (it.hint === 'likely-ok') head.appendChild(el('span', 'tag', 'غالباً صحيح'));
    side.appendChild(head);
    var read = el('div', 'read');
    read.dir = 'auto';
    if (it.kind === 'page') {
      read.appendChild(el('span', '', plain(it.core)));
    } else {
      read.appendChild(el('span', 'ctx', plain(it.before)));
      if (isGap(it)) read.appendChild(el('span', 'gap', ' ▼ يبدو أن سطراً سقط هنا ▼ '));
      else read.appendChild(el('mark', '', plain(it.core)));
      read.appendChild(el('span', 'ctx', plain(it.after)));
    }
    side.appendChild(read);
    if (isGap(it) && it.options.length) {
      side.appendChild(el('div', 'alt', 'السطر في الصورة كما قرأته قراءة أخرى: ' + short(it.options[0].text, 200)));
    }

    var choices = el('div', 'choices');
    var keepText = it.hint === 'header' ? 'هذه ترويسة، لا شيء ناقص'
      : isGap(it) ? 'شكّك في غير محله — لا شيء ناقص' : 'شكّك في غير محله — القراءة صحيحة';
    var keep = function () { answer('keep'); };
    var fix = function () { editor(cur, choices); };
    choices.appendChild(button('btn-lg btn-ok', keepText, keep, 'check', '1'));
    choices.appendChild(button('btn-lg btn-gold', 'شكّك في محله — الصواب هو…', fix, 'pen', '2'));
    side.appendChild(choices);

    var minor = el('div', 'minor');
    var prev = button('btn-sm', 'السابق', function () { go(RV.at - 1); }, 'back', '→');
    prev.disabled = RV.at === 0;
    minor.appendChild(prev);
    minor.appendChild(button('btn-sm', 'تخطَّ', function () { go(RV.at + 1); }, 'next', '←'));
    minor.appendChild(button('btn-sm', 'كل ما بقي في هذه الصفحة صحيح', rest, 'checks', '3'));
    side.appendChild(minor);
    if (RV.done[it.id]) side.appendChild(el('div', 'rv-note', 'أجبت عن هذا الموضع؛ إجابتك الجديدة تحل محل السابقة.'));
    grid.appendChild(side);
    body.appendChild(grid);
    RV.keys = { keep: keep, fix: fix, rest: rest,
      next: function () { go(RV.at + 1); }, prev: function () { go(RV.at - 1); },
      whole: function () { if (it.located) whole.click(); } };
    updateSend();
  }

  // Zoom so the place's column fills the box, then scroll to the place.
  function view(zoom, holder, page, it, full) {
    var w = zoom.clientWidth || 360;
    var col = !full && it.located && it.col ? it.col : [0, page.w];
    var scale = w / Math.max(1, col[1] - col[0]);
    holder.style.width = Math.round(page.w * scale) + 'px';
    (holder.frames || []).forEach(function (f) { f.style.display = 'none'; });
    holder.frames = (it.boxes || []).map(function (b) {
      var f = el('div', 'frame');
      f.style.left = Math.round(b[0] * scale - 5) + 'px';
      f.style.top = Math.round(b[1] * scale - 5) + 'px';
      f.style.width = Math.round((b[2] - b[0]) * scale + 10) + 'px';
      f.style.height = Math.round((b[3] - b[1]) * scale + 10) + 'px';
      holder.appendChild(f);
      return f;
    });
    var first = (it.boxes || [])[0];
    zoom.scrollLeft = Math.round(col[0] * scale);
    zoom.scrollTop = first && !full ? Math.max(0, Math.round(first[1] * scale - (zoom.clientHeight || 300) / 3)) : 0;
  }

  function image(name, done) {
    var rv = RV;
    if (rv.images[name]) return done(rv.images[name]);
    if (rv.waiting[name]) return rv.waiting[name].push(done);
    rv.waiting[name] = [done];
    var finish = function (src) {
      if (src) rv.images[name] = src;
      var list = rv.waiting[name] || [];
      delete rv.waiting[name];
      list.forEach(function (f) { f(src); });
    };
    google.script.run
      .withSuccessHandler(function (text) { var r = parse(text); finish(r.ok ? r.src : ''); })
      .withFailureHandler(function () { finish(''); })
      .getReviewImage(rv.fileId, name);
  }

  // The images of the next two pages are fetched ahead, so moving on is quick.
  function prefetch() {
    var seen = {}, n = 0;
    seen[RV.flat[RV.at].page.img] = true;
    for (var k = RV.at + 1; k < RV.flat.length && n < 2; k++) {
      var name = RV.flat[k].page.img;
      if (!name || seen[name]) continue;
      seen[name] = true;
      n++;
      image(name, function () {});
    }
  }

  function editor(cur, choices) {
    var it = cur.item;
    choices.textContent = '';
    var box = el('div');
    box.appendChild(el('div', 'ed-l', isGap(it) ? 'اكتب السطر الساقط كما في الصورة:'
      : it.kind === 'page' ? 'صحّح نص الصفحة كما في الصورة:' : 'اكتب الصواب مكان الكلام المظلل:'));
    var ta = el('textarea', 'in');
    ta.dir = 'rtl';
    var first = isGap(it) ? (it.options[0] ? it.options[0].text : '') : it.core;
    if (isGap(it) && it.hint === 'heading') first = '## ' + first;
    ta.value = first;
    var fills = el('div', 'fills');
    var fill = function (label, value) {
      var b = el('button', 'fill', label);
      b.type = 'button';
      b.addEventListener('click', function () {
        ta.value = value;
        if (ta.focus) ta.focus();
      });
      fills.appendChild(b);
    };
    it.options.forEach(function (o) {
      if (o.label === 'other') fill(o.text ? 'القراءة الأخرى: ' + short(o.text, 40) : 'القراءة الأخرى: (لا شيء)', o.text);
      if (o.label === 'ocr') fill('القراءة الآلية: ' + short(o.text, 40), o.text);
    });
    if (String(it.core).trim()) fill('احذف المظلل', '');
    if (isGap(it)) {
      var h = el('button', 'fill', 'عنوان');
      h.type = 'button';
      h.addEventListener('click', function () {
        ta.value = /^#+\s/.test(ta.value) ? ta.value.replace(/^#+\s*/, '') : '## ' + ta.value;
      });
      fills.appendChild(h);
    }
    box.appendChild(fills);
    box.appendChild(ta);
    var save = function () { answer('fix', ta.value); };
    var acts = el('div', 'ed-acts');
    acts.appendChild(button('btn-gold', 'حفظ والتالي', save, 'check', 'Ctrl+Enter'));
    acts.appendChild(button('btn-quiet', 'إلغاء', showItem, '', 'Esc'));
    box.appendChild(acts);
    choices.appendChild(box);
    RV.editing = { save: save, cancel: showItem };
    if (ta.focus) ta.focus();
  }

  function answer(verdict, text) {
    var cur = RV.flat[RV.at];
    var it = cur.item;
    var a = { page: cur.page.page, kind: it.kind, fp: it.fp, before: it.before, core: it.core, after: it.after,
      pos: it.pos, base: cur.page.base, place: it.place || '', verdict: verdict };
    if (verdict === 'fix') a.text = String(text || '');
    enqueue(it.id, a);
    RV.done[it.id] = verdict;
    go(RV.at + 1);
  }

  // "The rest of this page is right": the places of the page not answered yet.
  function rest() {
    var page = RV.flat[RV.at].page.page;
    var left = RV.flat.filter(function (x) { return x.page.page === page && !RV.done[x.item.id]; }).slice(0, 25);
    if (left.length) {
      enqueue('p' + page + '-rest-' + Date.now().toString(36), { kind: 'rest', page: page, verdict: 'keep',
        ids: left.map(function (x) { return x.item.id; }), fps: left.map(function (x) { return x.item.fp; }) });
      left.forEach(function (x) { RV.done[x.item.id] = 'keep'; });
    }
    var k = RV.at;
    while (k < RV.flat.length && RV.flat[k].page.page === page) k++;
    go(k);
  }

  function go(k) {
    if (k < 0) return;
    RV.at = Math.min(k, RV.flat.length);
    if (RV.at >= RV.flat.length) finished(); else showItem();
  }

  function finished() {
    RV.keys = null;
    RV.editing = null;
    var body = document.getElementById('rv-body');
    body.textContent = '';
    document.getElementById('rv-bar').style.width = '100%';
    document.getElementById('rv-count').textContent = '';
    var answered = RV.flat.filter(function (x) { return RV.done[x.item.id]; }).length;
    var skipped = RV.flat.length - answered;
    var box = el('div', 'rv-done');
    box.appendChild(icon('checks'));
    box.appendChild(el('b', '', RV.flat.length ? 'انتهت المواضع.' : 'لا مواضع تنتظر المراجعة الآن.'));
    if (RV.flat.length) box.appendChild(el('p', '', 'اضغط «أرسل التصحيحات» في الأسفل ليُحدَّث الكتاب بإجاباتك.'));
    if (skipped) {
      box.appendChild(el('p', '', 'تخطّيت ' + count(skipped, 'موضعاً واحداً', 'موضعين', 'مواضع', 'موضعاً') +
        '؛ تجدها مرة أخرى في المراجعة القادمة.'));
      box.appendChild(button('btn-sm', 'ارجع إلى أول موضع لم تُجب عنه', function () {
        for (var k = 0; k < RV.flat.length; k++) if (!RV.done[RV.flat[k].item.id]) return go(k);
      }, 'back'));
    }
    body.appendChild(box);
    updateSend();
  }

  function enqueue(id, a) {
    RV.outbox[id] = a;
    remember(RV);
    flush(RV);
  }

  // One saveAnswers call at a time, carrying everything waiting; tried again after
  // 3, 10 and 30 seconds, then the user is asked.
  function flush(rv) {
    if (rv.saving || !Object.keys(rv.outbox).length) return updateSend();
    var batch = rv.outbox;
    rv.outbox = {};
    rv.saving = batch;
    updateSend();
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        if (!r.ok) return failed(rv, batch, r.busy ? 'مشغول بفحص آخر' : r.error);
        rv.saving = null;
        rv.tries = 0;
        rv.stuck = false;
        rv.saved = r.pending || 0;
        remember(rv);
        flush(rv);
      })
      .withFailureHandler(function (err) { failed(rv, batch, errText(err)); })
      .saveAnswers(rv.fileId, JSON.stringify(batch));
  }

  function failed(rv, batch, why) {
    Object.keys(batch).forEach(function (id) { if (!rv.outbox[id]) rv.outbox[id] = batch[id]; });
    rv.saving = null;
    remember(rv);
    if (rv.tries < RETRY.length) {
      setTimeout(function () { flush(rv); }, RETRY[rv.tries++]);
    } else {
      rv.stuck = why || 'خطأ غير معروف';
    }
    updateSend();
  }

  function updateSend() {
    if (!RV) return;
    var waiting = Object.keys(RV.outbox).length + (RV.saving ? Object.keys(RV.saving).length : 0);
    var btn = document.getElementById('rv-send');
    var info = document.getElementById('rv-saving');
    var n = (RV.saved || 0) + waiting;
    btn.textContent = 'أرسل التصحيحات' + (n ? ' (' + n + ')' : '');
    btn.armed = false;
    btn.disabled = waiting > 0 || !n;
    info.className = RV.stuck ? 'is-bad' : '';
    info.textContent = '';
    var text = RV.stuck ? 'لم تُحفظ ' + waiting + ' إجابة (' + RV.stuck + ').' + HELP
      : waiting ? 'جارٍ حفظ ' + waiting + ' إجابة…' : n ? 'إجاباتك محفوظة.' : '';
    if (text) {
      info.appendChild(el('span', 'dot is-' + (RV.stuck ? 'bad' : waiting ? 'busy' : 'ok')));
      info.appendChild(el('span', '', text));
    }
    if (RV.stuck && waiting) {
      info.appendChild(button('btn-sm', 'أعد المحاولة', function () { RV.stuck = false; RV.tries = 0; flush(RV); }, 'refresh'));
    }
  }

  function sendReview(fileId, btn, after) {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        btn.disabled = false;
        if (!r.ok) {
          var why = r.busy ? 'يوجد فحص يعمل الآن، أعد المحاولة بعد دقيقة.' : 'تعذّر الإرسال: ' + (r.error || '') + '.' + HELP;
          if (after) setRvMsg(why, true); else setMsg(why, r.busy ? 'info' : 'bad');
          return;
        }
        var text2 = r.started ? 'بدأ تحديث الكتاب بإجاباتك، وتصلك رسالة حين يجهز (نحو نصف ساعة).'
          : r.nothing ? 'لا إجابات جديدة لإرسالها.'
          : 'يبدأ تحديث الكتاب تلقائياً بعد أن ينتهي الكتاب الجاري تحويله.';
        if (after) after();
        setMsg(text2, r.nothing ? 'info' : 'ok');
        refresh();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        var why = 'تعذّر الإرسال: ' + errText(err) + '.' + HELP;
        if (after) setRvMsg(why, true); else setMsg(why);
      })
      .sendReview(fileId);
  }

  function closeReview() {
    show('home');
    RV = null;
    refresh();
  }

  document.getElementById('rv-back').addEventListener('click', closeReview);
  document.getElementById('rv-send').addEventListener('click', function () {
    var btn = this;
    if (!RV || btn.disabled) return;
    if (!btn.armed) {
      btn.armed = true;
      btn.textContent = 'تأكيد: أرسل الآن';
      setRvMsg(LAST && LAST.active ? 'يُحدَّث الكتاب بعد أن ينتهي الكتاب الجاري تحويله. اضغط مرة أخرى للتأكيد.'
        : 'يُحدَّث الكتاب خلال نصف ساعة تقريباً وتصلك رسالة. اضغط مرة أخرى للتأكيد.');
      return;
    }
    var fileId = RV.fileId;
    sendReview(fileId, btn, function () { show('home'); RV = null; });
  });

  // ------------------------------------------------------------------------
  // The helper on the user's computer: its install line, its own lines and
  // buttons (from its status file), and the requests it has not finished.
  // ------------------------------------------------------------------------
  var PICKS = {};

  function renderHelper(s) {
    var box = document.getElementById('helper');
    box.textContent = '';
    var h = s.helper;
    box.hidden = !h;
    if (!h) return;
    box.appendChild(cardHead('monitor', 'المساعد على جهازك',
      h.connected ? st('ok', 'متصل') : h.seen ? st('bad', 'غير متصل') : st('wait', 'غير مثبّت')));
    box.appendChild(el('div', 'sub', h.connected ? 'آخر اتصال قبل ' + duration(h.minutes) + '.'
      : h.seen ? 'غير متصل منذ ' + duration(h.minutes) + '. يعمل حين يكون جهازك مفتوحاً.'
      : 'لم يُثبَّت بعد على جهازك. ثبّته مرة واحدة بالسطر في الأسفل.'));
    if (h.error) box.appendChild(note('hold', h.error));
    (h.lines || []).forEach(function (l) {
      var d = l.kind ? note(l.kind === 'bad' ? 'bad' : 'hold', l.text) : el('div', 'hl', l.text);
      if (l.link && /^https:\/\/(drive|docs)\.google\.com\//.test(l.link)) (d.p || d).appendChild(link(l.link, l.linkText || 'افتح'));
      box.appendChild(d);
    });
    (h.pending || []).forEach(function (p) {
      var r = el('div', 'req');
      r.appendChild(st(p.id === h.busy ? 'run' : 'wait', p.id === h.busy ? 'يعمل الآن' : 'ينتظر المساعد'));
      r.appendChild(el('span', '', (p.label || p.action) + ' · طُلب ' + when(p.at)));
      box.appendChild(r);
    });
    (h.actions || []).forEach(function (a) { box.appendChild(helperAction(a)); });

    if (h.line) {
      var holder = box;
      if (h.seen) {
        holder = el('details', 'inst');
        holder.appendChild(el('summary', '', 'إعادة التثبيت'));
        box.appendChild(holder);
      } else {
        var h3 = el('div', 'h3');
        h3.appendChild(icon('terminal'));
        h3.appendChild(el('span', '', 'التثبيت'));
        box.appendChild(h3);
      }
      holder.appendChild(el('div', 'sub', 'على جهازك: افتح PowerShell، والصق هذا السطر، ثم اضغط Enter (مرة واحدة فقط):'));
      var input = el('input', 'code');
      input.readOnly = true;
      input.value = h.line;
      input.addEventListener('focus', function () { input.select(); });
      holder.appendChild(input);
      var copy = button('btn-sm btn-gold', 'انسخ السطر', function () {
        input.focus();
        input.select();
        var done = function () { setLabel(copy, 'نُسخ ✓'); };
        try {
          if (document.execCommand('copy')) return done();
        } catch (e) { /* try the other way */ }
        if (navigator.clipboard) navigator.clipboard.writeText(h.line).then(done, function () {
          setLabel(copy, 'انسخه يدوياً (Ctrl+C)');
        });
      }, 'copy');
      holder.appendChild(copy);
    }
  }

  // One button of the helper's, with its choices: {id, label, button, options: [{name, label, choices: [{value, label}]}]}.
  function helperAction(a) {
    var box = el('div', 'act');
    box.appendChild(el('b', '', String(a.label || '')));
    if (a.note) box.appendChild(el('div', 'sub', String(a.note)));
    var selects = [];
    (Array.isArray(a.options) ? a.options : []).forEach(function (o) {
      var lab = el('label', '', String(o.label || ''));
      var sel = el('select', 'in');
      (Array.isArray(o.choices) ? o.choices : []).forEach(function (c) {
        var opt = el('option', '', String(c.label || c.value));
        opt.value = String(c.value);
        sel.appendChild(opt);
      });
      var key = a.id + '/' + o.name;
      if (PICKS[key] !== undefined) sel.value = PICKS[key];
      sel.addEventListener('change', function () { PICKS[key] = sel.value; });
      lab.appendChild(sel);
      box.appendChild(lab);
      selects.push({ name: String(o.name), sel: sel });
    });
    var btn = button('btn-gold', String(a.button || 'ابدأ'), function () {
      var choices = {};
      var words = [String(a.label || '')];
      selects.forEach(function (x) {
        choices[x.name] = x.sel.value;
        var opt = x.sel.options[x.sel.selectedIndex];
        if (opt) words.push(opt.textContent);
      });
      btn.disabled = true;
      setMsg('جارٍ إرسال الطلب…');
      google.script.run
        .withSuccessHandler(function (text) {
          var r = parse(text);
          btn.disabled = false;
          setMsg(r.ok ? 'أُرسل الطلب. يبدأ المساعد خلال دقائق إن كان جهازك مفتوحاً.' : 'تعذّر الطلب: ' + (r.error || ''));
          refresh();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          setMsg('تعذّر الطلب: ' + errText(err));
        })
        .helperRequest(JSON.stringify({ action: String(a.id), choices: choices, label: words.join(' — ') }));
    }, 'play');
    box.appendChild(btn);
    return box;
  }

  // ------------------------------------------------------------------------
  // The boxes: the models on the user's computer go to work when moved from the
  // right box of a section to its left box (dragged on a computer, or tapped), and
  // stop when moved back.
  // ------------------------------------------------------------------------
  var BOXES = null;
  var BOXES_SAVING = 0;
  var TIMES_OPEN = {};
  var DRAFT = {};
  var SECTIONS = [
    { key: 'transcribe', title: 'التفريغ',
      note: 'يقرأ النموذج المجاني الصفحة مرة، ونماذجك تقرؤها ثانيةً وتحسم الخلاف. إن نفد المجاني قامت نماذجك بالعمل كله.',
      empty: 'فارغ: النموذج المجاني يعمل وحده.' },
    { key: 'review', title: 'مراجعة المشكوك فيه',
      note: 'نماذجك تحكم على مواضع الشك. التصحيح الكبير لا يُطبَّق إلا إذا اتفق عليه نموذجان، وإجابتك تغلب دائماً.',
      empty: 'فارغ: المواضع تبقى لك.' }
  ];
  var CHIP_STATES = { working: ['run', 'يعمل'], idle: ['wait', 'ينتظر عملاً'], exhausted: ['hold', 'يرتاح'], failing: ['bad', 'يتعثّر'] };

  function modelOf(models, id) {
    for (var i = 0; i < models.length; i++) if (models[i].id === id) return models[i];
    return null;
  }

  function renderBoxes(s) {
    var box = document.getElementById('boxes');
    box.textContent = '';
    var h = s && s.helper;
    box.hidden = !h || !h.seen;
    if (box.hidden) return;
    // While a change is being saved, the page keeps showing it.
    if (!BOXES_SAVING || !BOXES) {
      var b = h.boxes || {};
      BOXES = { transcribe: (b.transcribe || []).slice(), review: (b.review || []).slice(),
        times: JSON.parse(JSON.stringify(b.times || {})) };
    }
    box.appendChild(cardHead('cpu', 'نماذجك على الجهاز', st(h.connected ? 'ok' : 'bad', h.connected ? 'جهازك متصل' : 'جهازك غير متصل')));
    box.appendChild(el('div', 'sub', 'نماذج اشتراكاتك تعمل حين يكون عندك فائض: انقل النموذج إلى «تعمل الآن» فيبدأ، وأوقفه متى شئت.'));
    if (!h.connected) {
      box.appendChild(note('hold', 'جهازك غير متصل الآن، فلا يعمل أي نموذج حتى تفتحه.' +
        (BOXES.transcribe.length ? ' إن طال الغياب أكمل النموذج المجاني الكتب وحده.' : '')));
    }
    var models = h.models || [];
    if (!models.length) {
      box.appendChild(note('hold', 'لم يجد المساعد بعد أي برنامج نماذج على جهازك.'));
      return;
    }
    SECTIONS.forEach(function (sec) { box.appendChild(boxSection(sec, models, h)); });
  }

  function boxSection(sec, models, h) {
    var wrap = el('div', 'bx');
    var on = BOXES[sec.key];
    var head = el('div', 'bx-h');
    head.appendChild(el('h3', '', sec.title));
    head.appendChild(on.length ? st('run', count(on.length, 'نموذج يعمل', 'نموذجان يعملان', 'نماذج تعمل', 'نموذجاً يعمل')) : st('wait', 'لا نموذج'));
    wrap.appendChild(head);
    wrap.appendChild(el('div', 'sub', sec.note));
    var pair = el('div', 'pair');
    // Right to left: the first box is on the right.
    var offBox = dropBox(sec.key, false, 'grid', 'المتاحة', 'المس النموذج أو اسحبه إلى «تعمل الآن»');
    var onBox = dropBox(sec.key, true, 'play', 'تعمل الآن', '');
    // The models waiting in the right box, in rows under the name of their program.
    var groups = [];
    models.forEach(function (m) {
      if (on.indexOf(m.id) >= 0) return;
      var g = null;
      for (var i = 0; i < groups.length; i++) if (groups[i].tool === m.tool) g = groups[i];
      if (!g) groups.push(g = { tool: m.tool, list: [] });
      g.list.push(m);
    });
    groups.forEach(function (g) {
      var group = el('div', 'grp');
      if (g.tool) group.appendChild(el('div', 'grp-n', g.tool));
      var row = el('div', 'mchips');
      g.list.forEach(function (m) { row.appendChild(chip(sec.key, m)); });
      group.appendChild(row);
      offBox.appendChild(group);
    });
    if (!groups.length) offBox.appendChild(el('div', 'box-e', 'كل نماذجك في «تعمل الآن».'));
    on.forEach(function (id) {
      onBox.appendChild(modelCard(sec.key, modelOf(models, id) || { id: id, label: id, tool: '', gone: true }, h));
    });
    if (!on.length) {
      var e = el('div', 'box-e');
      e.appendChild(icon('next'));
      e.appendChild(el('span', '', sec.empty));
      onBox.appendChild(e);
    }
    pair.appendChild(offBox);
    pair.appendChild(onBox);
    wrap.appendChild(pair);
    return wrap;
  }

  function draggable(node, id) {
    node.draggable = true;
    node.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', JSON.stringify({ id: id }));
      e.dataTransfer.effectAllowed = 'move';
    });
  }

  // A model waiting in the right box: a tap starts it.
  function chip(sec, m) {
    var b = el('button', 'mchip' + (m.warn ? ' is-warn' : ''));
    b.type = 'button';
    b.title = 'شغّل ' + m.label;
    b.appendChild(icon('plus'));
    // Latin names keep their own direction inside the Arabic page.
    b.appendChild(el('span', '', m.label)).dir = 'auto';
    if (m.warn) b.appendChild(el('small', '', '⚠ ' + m.warn));
    b.addEventListener('click', function () { moveChip(sec, m.id, true); });
    draggable(b, m.id);
    return b;
  }

  // A model at work: what it does, when it may work, and a button to stop it.
  function modelCard(sec, m, h) {
    var c = (h.chips || {})[m.id];
    var t = BOXES.times[m.id] || {};
    var now = Date.now();
    var startAt = Date.parse(t.start || ''), stopAt = Date.parse(t.stop || '');
    var ended = isFinite(stopAt) && stopAt <= now, later = isFinite(startAt) && startAt > now;
    var state = m.gone ? ['bad', 'غير موجود']
      : ended ? ['wait', 'انتهى وقته']
      : later ? ['wait', 'مجدول']
      : c ? CHIP_STATES[c.state] || ['wait', 'ينتظر']
      : ['wait', h.connected ? 'يبدأ قريباً' : 'ينتظر جهازك'];
    var d = el('div', 'mcard is-' + state[0]);
    draggable(d, m.id);
    var top = el('div', 'mc-h');
    var name = el('div', 'mc-n');
    name.appendChild(el('b', '', m.label)).dir = 'auto';
    if (m.tool) name.appendChild(el('span', '', m.tool));
    top.appendChild(name);
    var stop = button('btn-sm btn-quiet', 'أوقف', function () { moveChip(sec, m.id, false); }, 'stop');
    stop.title = 'يكمل ما بين يديه ثم يتوقف';
    top.appendChild(stop);
    d.appendChild(top);
    var line = el('div', 'mc-s');
    line.appendChild(st(state[0], state[1]));
    line.appendChild(el('span', '', m.gone ? 'لم يعد على جهازك'
      : ended ? 'انتهى الوقت الذي حددته له.'
      : later ? 'يبدأ ' + when(t.start) + '.'
      : c && c.text ? c.text
      : h.connected ? 'يبدأ خلال دقيقة أو دقيقتين' : 'ينتظر أن يتصل جهازك'));
    d.appendChild(line);
    if (m.warn) d.appendChild(el('div', 'mc-w', '⚠ ' + m.warn));
    if (c && /^(exhausted|failing)$/.test(c.state) && !m.gone) d.appendChild(retryButton(m));
    if (!m.gone) d.appendChild(schedule(sec, m, t));
    return d;
  }

  function retryButton(m) {
    var b = button('btn-sm', 'أعد المحاولة الآن', function () {
      b.disabled = true;
      setMsg('جارٍ الطلب…');
      google.script.run
        .withSuccessHandler(function (text) {
          var r = parse(text);
          setMsg(r.ok ? 'يعاود «' + m.label + '» خلال دقيقة أو دقيقتين إن كان جهازك مفتوحاً.' : 'تعذّر الطلب: ' + (r.error || ''));
          if (!r.ok) b.disabled = false;
        })
        .withFailureHandler(function (err) {
          b.disabled = false;
          setMsg('تعذّر الطلب: ' + errText(err));
        })
        .helperRequest(JSON.stringify({ action: 'retry', choices: { model: m.id }, label: 'أعد المحاولة: ' + m.label }));
    }, 'refresh');
    return b;
  }

  function dropBox(sec, isOn, ic, head, hint) {
    var base = 'box' + (isOn ? ' is-on' : '');
    var d = el('div', base);
    var hd = el('div', 'box-h');
    hd.appendChild(icon(ic));
    hd.appendChild(el('span', '', head));
    if (hint) hd.appendChild(el('small', '', hint));
    d.appendChild(hd);
    d.addEventListener('dragover', function (e) { e.preventDefault(); d.className = base + ' is-over'; });
    d.addEventListener('dragleave', function () { d.className = base; });
    d.addEventListener('drop', function (e) {
      e.preventDefault();
      d.className = base;
      var x = null;
      try { x = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (err) { /* not a model */ }
      if (x && x.id) moveChip(sec, String(x.id), isOn);
    });
    return d;
  }

  // When a model may work: "يبدأ" and "يتوقف" at a day and a clock time, folded under one line.
  var DAYS = ['اليوم', 'غداً', 'بعد غد'];

  function timeText(iso, key) {
    var at = Date.parse(iso || '');
    if (isFinite(at) && at > Date.now()) return when(iso);
    return key === 'stop' ? (isFinite(at) ? 'توقّف' : 'لا يتوقف') : 'الآن';
  }

  function schedule(sec, m, t) {
    var wrap = el('div', 'mc-t');
    var line = el('div', 'mc-ts');
    line.appendChild(icon('clock'));
    line.appendChild(el('span', '', 'يبدأ: ' + timeText(t.start, 'start') + ' · يتوقف: ' + timeText(t.stop, 'stop')));
    var key = sec + '|' + m.id;
    line.appendChild(button('btn-sm btn-quiet', TIMES_OPEN[key] ? 'إخفاء' : 'المواعيد', function () {
      TIMES_OPEN[key] = !TIMES_OPEN[key];
      renderBoxes(LAST);
    }, 'calendar'));
    wrap.appendChild(line);
    if (TIMES_OPEN[key]) {
      var box = el('div', 'times');
      box.appendChild(timeRow(m.id, 'start', 'يبدأ', t.start));
      box.appendChild(timeRow(m.id, 'stop', 'يتوقف', t.stop));
      wrap.appendChild(box);
    }
    return wrap;
  }

  function dayName(offset) {
    if (offset < DAYS.length) return DAYS[offset];
    var d = new Date();
    d.setDate(d.getDate() + offset);
    try {
      return d.toLocaleDateString('ar', { calendar: 'gregory', numberingSystem: 'latn', weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) {
      return d.toDateString();
    }
  }

  function timeRow(id, key, label, iso) {
    var row = el('div', 'trow');
    row.appendChild(el('span', '', label));
    var fields = el('div', 'tin');
    // What the user chose but has not set yet survives the page's own refresh.
    var dk = id + '|' + key;
    var draft = DRAFT[dk] || {};
    var day = el('select', 'in');
    for (var i = 0; i < 8; i++) { var o = el('option', '', dayName(i)); o.value = String(i); day.appendChild(o); }
    if (draft.day) day.value = draft.day;
    day.addEventListener('change', function () { (DRAFT[dk] = DRAFT[dk] || {}).day = day.value; });
    var clock = el('input', 'in');
    clock.type = 'time';
    if (draft.clock) clock.value = draft.clock;
    clock.addEventListener('input', function () { (DRAFT[dk] = DRAFT[dk] || {}).clock = clock.value; });
    fields.appendChild(day);
    fields.appendChild(clock);
    fields.appendChild(button('btn-sm', 'حدّد', function () {
      var hm = /^(\d{1,2}):(\d{2})/.exec(clock.value || '');
      if (!hm) return setMsg('اختر الساعة.', 'info');
      var d = new Date();
      d.setDate(d.getDate() + Number(day.value));
      d.setHours(Number(hm[1]), Number(hm[2]), 0, 0);
      if (d.getTime() <= Date.now()) return setMsg('هذا الوقت مضى، اختر وقتاً بعد الآن.', 'info');
      delete DRAFT[dk];
      setTime(id, key, d.toISOString());
    }));
    if (isFinite(Date.parse(iso || ''))) {
      fields.appendChild(button('btn-sm btn-quiet', key === 'start' ? 'ابدأ الآن' : 'بلا توقف', function () { setTime(id, key, ''); }));
    }
    row.appendChild(fields);
    return row;
  }

  function setTime(id, key, iso) {
    var next = copyBoxes(BOXES);
    var t = next.times[id] || {};
    t[key] = iso;
    if (t.start || t.stop) next.times[id] = t; else delete next.times[id];
    saveBoxes(next, key === 'start' ? (iso ? 'يبدأ ' + when(iso) + '.' : 'يبدأ الآن.') : (iso ? 'يتوقف ' + when(iso) + '.' : 'لا يتوقف.'));
  }

  function copyBoxes(b) {
    return { transcribe: b.transcribe.slice(), review: b.review.slice(), times: JSON.parse(JSON.stringify(b.times || {})) };
  }

  function moveChip(sec, id, toOn) {
    var next = copyBoxes(BOXES);
    next[sec] = next[sec].filter(function (x) { return x !== id; });
    if (toOn) next[sec].push(id);
    if (JSON.stringify(next) === JSON.stringify(BOXES)) return;
    saveBoxes(next, toOn ? 'يبدأ خلال دقيقة أو دقيقتين إن كان جهازك مفتوحاً.' : 'يكمل ما بين يديه ثم يتوقف.');
  }

  function saveBoxes(next, done) {
    var prev = BOXES;
    BOXES = next;
    BOXES_SAVING++;
    renderBoxes(LAST);
    setMsg('جارٍ الحفظ…');
    var undo = function (why) {
      BOXES_SAVING--;
      BOXES = prev;
      setMsg('تعذّر الحفظ: ' + why);
      renderBoxes(LAST);
    };
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        if (!r.ok) return undo(r.error || '');
        BOXES_SAVING--;
        // The page's copy of the status follows, so drawing the boxes again keeps the change.
        if (LAST && LAST.helper) LAST.helper.boxes = copyBoxes(next);
        setMsg(done);
      })
      .withFailureHandler(function (err) { undo(errText(err)); })
      .setHelperBoxes(JSON.stringify(next));
  }

  // ------------------------------------------------------------------------
  // Windows: the themes and the keyboard shortcuts.
  // ------------------------------------------------------------------------
  var MODAL = null;

  function openModal(title, body) {
    closeModal();
    var layer = el('div', 'ml');
    var scrim = el('div', 'ml-scrim');
    scrim.addEventListener('click', closeModal);
    layer.appendChild(scrim);
    var m = el('div', 'modal');
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
    m.setAttribute('aria-label', title);
    var head = el('div', 'modal-h');
    head.appendChild(el('h3', '', title));
    var x = button('btn-quiet btn-icon', '', closeModal, 'x');
    x.setAttribute('aria-label', 'إغلاق');
    head.appendChild(x);
    m.appendChild(head);
    var b = el('div', 'modal-b');
    b.appendChild(body);
    m.appendChild(b);
    layer.appendChild(m);
    document.body.appendChild(layer);
    MODAL = { layer: layer, back: document.activeElement };
    x.focus();
  }

  function closeModal() {
    if (!MODAL) return;
    var back = MODAL.back;
    if (MODAL.layer.parentNode) MODAL.layer.parentNode.removeChild(MODAL.layer);
    MODAL = null;
    if (back && back.focus) back.focus();
  }

  // Each theme with its colours for the little preview: page, side bar, text, gold.
  var THEMES = [
    { id: 'auto', name: 'تلقائي (يتبع الجهاز)' },
    { id: 'gold', name: 'الأسود والذهبي', c: ['#18181a', '#0a0a0a', '#f5f1e8', '#c9a55c'] },
    { id: 'navy', name: 'الكحلي', c: ['#10223a', '#0b1a2e', '#f5f1e8', '#c9a55c'] },
    { id: 'green', name: 'الأخضر', c: ['#112720', '#0d1f1a', '#f5f1e8', '#c9a55c'] },
    { id: 'burgundy', name: 'العنّابي', c: ['#221016', '#1a0a0f', '#f5f1e8', '#c9a55c'] },
    { id: 'charcoal', name: 'الفحمي', c: ['#292929', '#1c1c1c', '#f2efe9', '#b89968'] },
    { id: 'slate', name: 'الرصاصي', c: ['#283540', '#1e2830', '#eef1f3', '#cdb887'] },
    { id: 'espresso', name: 'البنّي', c: ['#2f221a', '#1f1611', '#f4ece1', '#c9935b'] },
    { id: 'ivory', name: 'العاجي', c: ['#f7f3eb', '#efe8da', '#2a1f0f', '#8a6d2a'] },
    { id: 'white', name: 'الأبيض', c: ['#f4f4f2', '#ffffff', '#1d1d1f', '#9a7a35'] },
    { id: 'parchment', name: 'الورق القديم', c: ['#f2e9d6', '#e7dbc1', '#36261a', '#7a5424'] },
    { id: 'linen', name: 'الكتّاني', c: ['#f5f3ed', '#e6e5e1', '#1f242b', '#2f4b6e'] }
  ];

  function theme() {
    try { return localStorage.getItem('cb-ui') || 'auto'; } catch (e) { return 'auto'; }
  }

  function applyTheme(id) {
    document.documentElement.setAttribute('data-ui', id);
  }

  function setTheme(id) {
    applyTheme(id);
    try { localStorage.setItem('cb-ui', id); } catch (e) { /* kept for this visit only */ }
  }

  function preview(t) {
    var p = el('span', 'th-p');
    var c = t.c || ['#18181a', '#f7f3eb', '#f5f1e8', '#c9a55c'];
    p.style.background = t.c ? c[0] : 'linear-gradient(135deg, #18181a 50%, #f7f3eb 50%)';
    var add = function (css) {
      var i = el('i');
      Object.keys(css).forEach(function (k) { i.style[k] = css[k]; });
      p.appendChild(i);
    };
    if (t.c) add({ top: '0', bottom: '0', right: '0', width: '24%', borderRadius: '0', background: c[1] });
    add({ top: '12px', right: '32%', width: '42%', height: '3px', background: t.c ? c[2] : '#c9a55c' });
    add({ top: '20px', right: '32%', width: '54%', height: '1px', background: c[3] });
    add({ top: '27px', right: '32%', width: '36%', height: '2px', background: t.c ? c[2] : '#c9a55c', opacity: '.5' });
    add({ bottom: '9px', right: '32%', width: '24%', height: '7px', background: c[3] });
    return p;
  }

  function showThemes() {
    var cur = theme();
    var body = el('div');
    body.appendChild(el('div', 'sub', 'يُحفظ اختيارك في هذا المتصفح. «تلقائي» يتبع وضع جهازك: الأسود والذهبي ليلاً، والعاجي نهاراً.'));
    var grid = el('div', 'th-grid');
    var tiles = [];
    THEMES.forEach(function (t) {
      var b = el('button', 'th' + (t.id === cur ? ' is-on' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', t.id === cur ? 'true' : 'false');
      b.appendChild(preview(t));
      b.appendChild(el('span', 'th-n', t.name));
      b.addEventListener('click', function () {
        setTheme(t.id);
        tiles.forEach(function (x) {
          x.node.className = 'th' + (x.id === t.id ? ' is-on' : '');
          x.node.setAttribute('aria-pressed', x.id === t.id ? 'true' : 'false');
        });
      });
      tiles.push({ id: t.id, node: b });
      grid.appendChild(b);
    });
    body.appendChild(grid);
    openModal('المظهر', body);
  }

  var KEYS_HOME = [['F', 'افحص الآن'], ['J', 'اعرض على الحكّام الآن'], ['R', 'حدّث الصفحة'], ['V', 'افتح أول مراجعة'],
    ['1 – 6', 'انتقل إلى قسم'], ['T', 'المظهر'], ['?', 'الاختصارات']];
  var KEYS_REVIEW = [['1', 'القراءة صحيحة'], ['2', 'صحّح'], ['3', 'كل ما بقي في الصفحة صحيح'], ['←', 'تخطَّ'], ['→', 'السابق'],
    ['Z', 'الصفحة كاملة أو الموضع'], ['Ctrl+Enter', 'احفظ التصحيح'], ['Esc', 'ألغِ التصحيح أو ارجع']];

  function showKeys() {
    var body = el('div');
    body.appendChild(el('div', 'sub', 'تعمل الحروف بأي لغة للوحة المفاتيح، ولا تعمل وأنت تكتب في خانة.'));
    var keys = el('div', 'keys');
    [['في الصفحة الرئيسية', KEYS_HOME], ['في شاشة المراجعة', KEYS_REVIEW]].forEach(function (g) {
      var col = el('div');
      col.appendChild(el('h4', '', g[0]));
      var ul = el('ul', 'kl');
      g[1].forEach(function (k) {
        var li = el('li');
        li.appendChild(el('span', '', k[1]));
        li.appendChild(el('kbd', '', k[0]));
        ul.appendChild(li);
      });
      col.appendChild(ul);
      keys.appendChild(col);
    });
    body.appendChild(keys);
    openModal('الاختصارات', body);
  }

  // Keys by their place on the keyboard (e.code), so an Arabic layout works too.
  document.addEventListener('keydown', function (e) {
    var t = e.target || {};
    var inField = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '') || t.isContentEditable;
    if (e.key === 'Escape') {
      if (MODAL) return closeModal();
      if (RV && RV.editing) return RV.editing.cancel();
      if (RV && !inField) return closeReview();
      return;
    }
    if (RV && RV.editing && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      return RV.editing.save();
    }
    if (inField || MODAL || e.ctrlKey || e.metaKey || e.altKey) return;
    var code = e.code || '';
    if (e.key === '?' || e.key === '؟' || (code === 'Slash' && e.shiftKey)) {
      e.preventDefault();
      return showKeys();
    }
    var digit = /^(Digit|Numpad)([1-9])$/.exec(code);
    if (RV) {
      var k = RV.editing ? null : RV.keys;
      if (!k) return;
      var act = digit && digit[2] === '1' ? k.keep : digit && digit[2] === '2' ? k.fix : digit && digit[2] === '3' ? k.rest
        : code === 'ArrowLeft' ? k.next : code === 'ArrowRight' ? k.prev : code === 'KeyZ' ? k.whole : null;
      if (act) { e.preventDefault(); act(); }
      return;
    }
    if (digit) {
      var id = NAV[Number(digit[2]) - 1];
      if (id) { e.preventDefault(); jump(id); }
      return;
    }
    var click = function (id) { var b = document.getElementById(id); if (b && !b.disabled) b.click(); };
    if (code === 'KeyF') click('check');
    else if (code === 'KeyJ') click('judge');
    else if (code === 'KeyR') refresh(function () { setMsg('حُدّثت الصفحة.'); });
    else if (code === 'KeyT') showThemes();
    else if (code === 'KeyV') {
      var first = ((LAST && LAST.reviews) || []).filter(function (b) { return b.open && b.note !== 'no-data'; })[0];
      if (first) openReview(first.fileId); else setMsg('لا مواضع تنتظر المراجعة.', 'info');
    } else return;
    e.preventDefault();
  });

  // The icons and buttons written in the page itself.
  function wire() {
    if (!document.querySelectorAll) return;
    var list = document.querySelectorAll('[data-ic]');
    for (var i = 0; i < list.length; i++) {
      var node = list[i], name = node.getAttribute('data-ic');
      if (/\b(mark|ch-ic)\b/.test(node.className)) {
        node.appendChild(icon(name));
      } else {
        node.className = (node.className ? node.className + ' ' : '') + 'ic';
        node.innerHTML = svg(name);
      }
    }
    var acts = document.querySelectorAll('[data-act]');
    for (var j = 0; j < acts.length; j++) {
      acts[j].addEventListener('click', acts[j].getAttribute('data-act') === 'theme' ? showThemes : showKeys);
    }
  }

  applyTheme(theme());
  wire();
  render(INITIAL);
  if (INITIAL && INITIAL.openReview) openReview(INITIAL.openReview);
</script>
</body>
