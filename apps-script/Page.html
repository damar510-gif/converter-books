<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  /* ═══════════════════════════════════════════════════════════════
     The office identity, as in the portal (bawaba) and the account statements (maleah):
     black #0a0a0a · gold #c9a55c · ivory #f5f1e8; Amiri for titles, Tajawal for text,
     Cormorant Garamond for big numbers. Nothing is loaded from outside: those fonts are
     used when the device has them, the device's own Arabic fonts otherwise.
     ═══════════════════════════════════════════════════════════════ */
  :root {
    --ink: #efe8da; --desk: #f7f3eb; --panel: #fffdf9; --panel-2: #faf6ee; --field: #ffffff; --field-2: #fbf8f2;
    --gold: #8a6d2a; --gold-soft: #9e8550; --gold-light: #6e5420; --cream: #2a1f0f; --dim: #5f5444; --mute: #8a7f6e;
    --line: rgba(138,109,42,.34); --line-soft: rgba(138,109,42,.2); --line-faint: rgba(138,109,42,.1);
    --alert: #a8402f; --alert-bg: rgba(168,64,47,.08); --ok: #4d7a3b; --ok-bg: rgba(77,122,59,.1);
    --hover: rgba(138,109,42,.07); --scrim: rgba(42,31,15,.42); --scheme: light; --on-gold: #fffdf8; --placeholder: #a2988a;
    --shadow: 0 12px 30px rgba(60,45,20,.14); --shadow-lg: 0 30px 80px rgba(60,45,20,.22);
    --f-ui: 'Tajawal', 'Noto Sans Arabic', 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    --f-display: 'Amiri', 'Noto Naskh Arabic', 'Sakkal Majalla', 'Traditional Arabic', 'Times New Roman', serif;
    --f-num: 'Cormorant Garamond', 'Palatino Linotype', 'Book Antiqua', 'Noto Serif', Georgia, serif;
    --side-w: 268px;
  }
  /* The dark themes share the gold and the text; each has its own background. */
  html[data-ui=gold], html[data-ui=navy], html[data-ui=green], html[data-ui=burgundy],
  html[data-ui=charcoal], html[data-ui=slate], html[data-ui=espresso] {
    --gold: #c9a55c; --gold-soft: #a8893f; --gold-light: #e4c989; --cream: #f5f1e8; --dim: #b9b3a3; --mute: #878174;
    --line: rgba(201,165,92,.3); --line-soft: rgba(201,165,92,.16); --line-faint: rgba(201,165,92,.08);
    --alert: #e0937f; --alert-bg: rgba(224,147,127,.1); --ok: #a9c79a; --ok-bg: rgba(169,199,154,.1);
    --hover: rgba(255,255,255,.04); --scrim: rgba(0,0,0,.72); --scheme: dark; --on-gold: #17110a; --placeholder: #6f6a5f;
    --shadow: 0 12px 30px rgba(0,0,0,.5); --shadow-lg: 0 30px 90px rgba(0,0,0,.7);
  }
  /* "Automatic" follows the device: black and gold at night, ivory by day. */
  @media (prefers-color-scheme: dark) {
    html:not([data-ui]), html[data-ui=auto] {
      --ink: #0a0a0a; --desk: #18181a; --panel: #111112; --panel-2: #151516; --field: #0e0e0f; --field-2: #0f0f10;
      --gold: #c9a55c; --gold-soft: #a8893f; --gold-light: #e4c989; --cream: #f5f1e8; --dim: #b9b3a3; --mute: #878174;
      --line: rgba(201,165,92,.3); --line-soft: rgba(201,165,92,.16); --line-faint: rgba(201,165,92,.08);
      --alert: #e0937f; --alert-bg: rgba(224,147,127,.1); --ok: #a9c79a; --ok-bg: rgba(169,199,154,.1);
      --hover: rgba(255,255,255,.04); --scrim: rgba(0,0,0,.72); --scheme: dark; --on-gold: #17110a; --placeholder: #6f6a5f;
      --shadow: 0 12px 30px rgba(0,0,0,.5); --shadow-lg: 0 30px 90px rgba(0,0,0,.7);
    }
  }
  html[data-ui=gold] { --ink: #0a0a0a; --desk: #18181a; --panel: #111112; --panel-2: #151516; --field: #0e0e0f; --field-2: #0f0f10; }
  html[data-ui=navy] { --ink: #0b1a2e; --desk: #10223a; --panel: #0d1e34; --panel-2: #12263f; --field: #0a1729; --field-2: #0c1b30; }
  html[data-ui=green] { --ink: #0d1f1a; --desk: #112720; --panel: #0f221c; --panel-2: #142b23; --field: #0b1b16; --field-2: #0d1e18; }
  html[data-ui=burgundy] { --ink: #1a0a0f; --desk: #221016; --panel: #1d0d12; --panel-2: #26131a; --field: #16090d; --field-2: #190b10; }
  html[data-ui=charcoal] { --ink: #1c1c1c; --desk: #292929; --panel: #222222; --panel-2: #262626; --field: #1e1e1e; --field-2: #202020;
    --gold: #b89968; --gold-soft: #9c8359; --gold-light: #d1bd9d; --cream: #f2efe9; --dim: #b5b1a9; --mute: #8a8782;
    --line: rgba(184,153,104,.3); --line-soft: rgba(184,153,104,.16); --line-faint: rgba(184,153,104,.08); --on-gold: #121212; --placeholder: #706e6a; }
  html[data-ui=slate] { --ink: #1e2830; --desk: #283540; --panel: #222e37; --panel-2: #26323d; --field: #202a33; --field-2: #212c34;
    --gold: #cdb887; --gold-soft: #a99a74; --gold-light: #ded1b1; --cream: #eef1f3; --dim: #a8b3bc; --mute: #818c95;
    --line: rgba(205,184,135,.3); --line-soft: rgba(205,184,135,.16); --line-faint: rgba(205,184,135,.08); --on-gold: #141a1f; --placeholder: #6a747d; }
  html[data-ui=espresso] { --ink: #1f1611; --desk: #2f221a; --panel: #261b15; --panel-2: #2c1f18; --field: #221812; --field-2: #241914;
    --gold: #c9935b; --gold-soft: #a37c4f; --gold-light: #dcb994; --cream: #f4ece1; --dim: #bea996; --mute: #918071;
    --line: rgba(201,147,91,.3); --line-soft: rgba(201,147,91,.16); --line-faint: rgba(201,147,91,.08); --on-gold: #140e0b; --placeholder: #76675a; }
  html[data-ui=white] { --ink: #ffffff; --desk: #f4f4f2; --panel: #ffffff; --panel-2: #f8f8f6; --field: #ffffff; --field-2: #f6f6f4;
    --gold: #9a7a35; --gold-soft: #a98c52; --gold-light: #7a5d22; --cream: #1d1d1f; --dim: #5b5b60; --mute: #8d8d92;
    --line: rgba(29,29,31,.16); --line-soft: rgba(29,29,31,.1); --line-faint: rgba(29,29,31,.06);
    --alert: #b23b2b; --alert-bg: rgba(178,59,43,.07); --ok: #3f7a3a; --ok-bg: rgba(63,122,58,.09);
    --hover: rgba(29,29,31,.045); --scrim: rgba(20,20,22,.38); --on-gold: #ffffff; --placeholder: #a3a3a8;
    --shadow: 0 12px 30px rgba(0,0,0,.1); --shadow-lg: 0 30px 80px rgba(0,0,0,.18); }
  html[data-ui=parchment] { --ink: #e7dbc1; --desk: #f2e9d6; --panel: #fdfbf7; --panel-2: #f5edde; --field: #fefefc; --field-2: #f7f2e6;
    --gold: #7a5424; --gold-soft: #947449; --gold-light: #694822; --cream: #36261a; --dim: #64503a; --mute: #8d7b63;
    --line: rgba(122,84,36,.34); --line-soft: rgba(122,84,36,.2); --line-faint: rgba(122,84,36,.1);
    --hover: rgba(122,84,36,.07); --scrim: rgba(54,38,26,.42); --on-gold: #fcfaf5; --placeholder: #a3937b; }
  html[data-ui=linen] { --ink: #e6e5e1; --desk: #f5f3ed; --panel: #fdfdfc; --panel-2: #f7f5f1; --field: #fefefe; --field-2: #f9f8f4;
    --gold: #2f4b6e; --gold-soft: #5a6f89; --gold-light: #2b415d; --cream: #1f242b; --dim: #4f555d; --mute: #7f8287;
    --line: rgba(47,75,110,.34); --line-soft: rgba(47,75,110,.2); --line-faint: rgba(47,75,110,.1);
    --hover: rgba(47,75,110,.07); --scrim: rgba(31,36,43,.42); --on-gold: #fdfcfb; --placeholder: #999b9d; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--desk); color: var(--cream); font-family: var(--f-ui); font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased; }
  html { color-scheme: var(--scheme); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  @media (max-width: 640px) { html, body { font-size: 15.5px; } }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; text-align: inherit; }
  a { color: var(--gold-light); text-decoration: none; }
  [hidden] { display: none !important; }
  ::selection { background: rgba(201,165,92,.35); }
  :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .ic { display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }
  .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  kbd { display: inline-block; min-width: 22px; text-align: center; font-family: var(--f-ui); font-size: 11px; font-weight: 500;
    line-height: 1.6; border: 1px solid var(--line-soft); border-bottom-width: 2px; border-radius: 3px; padding: 0 6px;
    color: var(--dim); background: var(--field); direction: ltr; }
  /* Keyboard hints only where there is a keyboard. */
  @media (hover: none) { kbd, .k-only { display: none !important; } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ───────── Frame: the side bar on a computer, the page beside it ───────── */
  .app { display: flex; min-height: 100vh; }
  .main { flex: 1; min-width: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 90px; }
  .side { display: none; }
  @media (min-width: 1024px) {
    .side { display: flex; flex-direction: column; width: var(--side-w); flex-shrink: 0; background: var(--ink);
      border-left: 1px solid var(--line-soft); height: 100vh; position: sticky; top: 0; z-index: 40; }
    .wrap { padding: 30px 40px 90px; }
    .jump, .vh-tools, .vh .mark { display: none !important; }
  }
  .app.is-review .side { display: none; }
  .side-brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; border-bottom: 1px solid var(--line-faint); }
  .side-brand b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.3; color: var(--cream); }
  .side-brand span { display: block; font-size: 12px; color: var(--gold-soft); }
  .mark { width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center;
    color: var(--gold); background: var(--ink); flex-shrink: 0; }
  .mark .ic { width: 25px; height: 25px; }
  .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 4px; color: var(--dim);
    position: relative; font-size: 14.5px; text-align: start; transition: color .15s, background-color .15s; }
  .nav-i:hover { color: var(--cream); background: var(--hover); }
  .nav-i.is-on { color: var(--gold-light); background: rgba(201,165,92,.09); }
  .nav-i.is-on::before { content: ''; position: absolute; right: -10px; top: 8px; bottom: 8px; width: 2px; background: var(--gold); }
  .nav-n { margin-inline-start: auto; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .nav-n.is-hold { color: var(--gold-light); font-weight: 700; }
  .side-foot { border-top: 1px solid var(--line-faint); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .side-tools { display: flex; gap: 4px; flex-wrap: wrap; }

  /* ───────── Buttons and fields ───────── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 14px;
    border: 1px solid var(--line); border-radius: 3px; color: var(--cream); font-size: 14px; font-weight: 500; line-height: 1.4;
    white-space: nowrap; transition: border-color .15s, color .15s, background-color .15s; }
  .btn:hover { border-color: var(--gold); color: var(--gold-light); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btn-gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 700; }
  .btn-gold:hover { background: var(--gold-light); border-color: var(--gold-light); color: var(--on-gold); }
  .btn-gold kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .7; }
  .btn-quiet { border-color: transparent; color: var(--dim); }
  .btn-quiet:hover { border-color: transparent; color: var(--gold-light); background: var(--hover); }
  .btn-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .btn-ok:hover { color: var(--ok); border-color: var(--ok); background: rgba(169,199,154,.18); }
  .btn-icon { padding: 0; width: 38px; }
  .btn-sm { min-height: 32px; padding: 4px 11px; font-size: 13px; }
  .btn-sm .ic { width: 16px; height: 16px; }
  .btn-lg { width: 100%; min-height: 54px; padding: 12px 18px; font-size: 16px; justify-content: flex-start; white-space: normal;
    text-align: start; }
  .btn-lg .ic { width: 21px; height: 21px; }
  .btn kbd { margin-inline-start: auto; }
  .btn-sm kbd, .acts kbd { margin-inline-start: 4px; }
  .in { background: var(--field); border: 1px solid var(--line-soft); border-radius: 3px; padding: 6px 9px; font-size: 14px;
    color: var(--cream); min-width: 0; transition: border-color .15s, box-shadow .15s; }
  .in::placeholder { color: var(--placeholder); }
  .in:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,165,92,.15); }

  /* ───────── States: one dot and one word, the same everywhere ───────── */
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 0 10px; line-height: 1.9;
    border: 1px solid var(--line-soft); border-radius: 20px; color: var(--dim); white-space: nowrap; }
  .st i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .st.is-run, .st.is-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .st.is-run i { animation: pulse 1.4s ease-in-out infinite; }
  .st.is-hold, .st.is-gold { color: var(--gold-light); border-color: var(--line); background: rgba(201,165,92,.1); }
  .st.is-bad { color: var(--alert); border-color: var(--alert); background: var(--alert-bg); }
  .st.is-wait i { background: var(--mute); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex-shrink: 0; }
  .dot.is-ok { background: var(--ok); }
  .dot.is-hold { background: var(--gold); }
  .dot.is-bad { background: var(--alert); }
  .dot.is-busy { background: var(--gold); animation: pulse .9s ease-in-out infinite; }
  .sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); min-width: 0; }
  .count { display: inline-block; font-size: 12px; color: var(--gold-soft); border: 1px solid var(--line-soft); border-radius: 20px;
    padding: 0 9px; line-height: 1.9; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count:empty { display: none; }

  /* ───────── Page head ───────── */
  .vh { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "t tools" "a a"; gap: 14px 16px;
    align-items: center; margin-bottom: 16px; }
  .vh-t { grid-area: t; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .vh-tools { grid-area: tools; display: flex; gap: 2px; }
  .acts { grid-area: a; display: flex; gap: 8px; flex-wrap: wrap; }
  .acts .btn { flex: 1 1 auto; }
  @media (min-width: 700px) {
    .vh { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "t a tools"; align-items: end; }
    .acts .btn { flex: none; }
  }
  .eyebrow { font-size: 12.5px; color: var(--mute); }
  .title { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.3; color: var(--cream); }
  @media (max-width: 640px) { .title { font-size: 26px; } }

  /* Section links on a phone: they stay at the top while the page scrolls. */
  .jump { position: sticky; top: 0; z-index: 30; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding: 8px 16px; margin: 0 -16px 16px; background: var(--desk); border-bottom: 1px solid var(--line-faint); }
  .jump::-webkit-scrollbar { display: none; }
  .jchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line-soft);
    border-radius: 20px; font-size: 13px; color: var(--dim); white-space: nowrap; flex-shrink: 0; }
  .jchip .ic { width: 14px; height: 14px; color: var(--gold-soft); }
  .jchip em { font-style: normal; font-size: 11.5px; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
  .jchip.is-on { color: var(--gold-light); border-color: var(--gold-soft); background: rgba(201,165,92,.12); }
  .jchip .dot { width: 7px; height: 7px; }
  section { scroll-margin-top: 64px; }
  @media (min-width: 1024px) { section { scroll-margin-top: 20px; } }

  /* ───────── The day at a glance ───────── */
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 560px) { .figs { grid-template-columns: 1fr 1fr; } .figs .fig:first-child { grid-column: 1 / -1; } }
  .fig { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; padding: 11px 15px 10px;
    background: var(--panel); border: 1px solid var(--line-faint); border-top: 2px solid var(--line-soft); border-radius: 3px;
    text-align: start; transition: border-color .15s, background-color .15s; }
  .fig:hover { border-color: var(--line); background: var(--panel-2); }
  .fig-l { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); }
  .fig-l .ic { width: 15px; height: 15px; color: var(--gold-soft); }
  .fig-v { font-family: var(--f-num); font-weight: 600; font-size: 31px; line-height: 1.2; color: var(--cream);
    font-variant-numeric: lining-nums tabular-nums; }
  .fig-v small { font-family: var(--f-ui); font-size: 14px; color: var(--mute); font-weight: 500; margin-inline-start: 2px; }
  .fig-s { font-size: 12px; color: var(--mute); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fig.is-run, .fig.is-ok { border-top-color: var(--ok); }
  .fig.is-hold { border-top-color: var(--gold); }
  .fig.is-hold .fig-v { color: var(--gold-light); }
  .fig.is-bad { border-top-color: var(--alert); }
  .fig.is-bad .fig-v { color: var(--alert); }

  /* ───────── Notes ───────── */
  .note { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); background: rgba(201,165,92,.07);
    padding: 10px 13px; border-radius: 3px; margin-top: 10px; font-size: 14px; line-height: 1.8; }
  .note > .ic { color: var(--gold); margin-top: 3px; }
  .note p { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .note.is-bad { border-color: var(--alert); background: var(--alert-bg); }
  .note.is-bad > .ic { color: var(--alert); }
  .note.is-ok { border-color: var(--ok); background: var(--ok-bg); }
  .note.is-ok > .ic { color: var(--ok); }
  #notices .note { margin: 0 0 12px; }

  /* ───────── Cards ───────── */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
  @media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
  .card { background: var(--panel); border: 1px solid var(--line-faint); border-radius: 4px; padding: 18px 20px; min-width: 0;
    margin-bottom: 18px; }
  .grid > .card { margin-bottom: 0; }
  @media (max-width: 640px) { .card { padding: 16px; } }
  .ch { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .ch-ic { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center;
    color: var(--gold); flex-shrink: 0; }
  .ch-ic .ic { width: 17px; height: 17px; }
  .ch h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; line-height: 1.3; color: var(--cream); }
  .ch .end { margin-inline-start: auto; }
  .sub { font-size: 13px; color: var(--mute); line-height: 1.8; }
  .ch + .sub { margin: -6px 0 12px; }
  .h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--gold-soft);
    margin: 16px 0 8px; padding-top: 14px; border-top: 1px solid var(--line-faint); }

  /* The book being converted. */

<body>
<div class="app" id="app">

</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
  var INITIAL = <?!= initialJson ?>;
