<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #5d6678;
    --line: #e2e5eb;
    --accent: #1a66d6;
    --accent-text: #ffffff;
    --ok: #1e7e34;
    --ok-bg: #e6f4ea;
    --warn: #8a5300;
    --warn-bg: #fef3e0;
    --bad: #b3261e;
    --bad-bg: #fce8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1c1f26;
      --text: #e8eaed;
      --muted: #a0a8b6;
      --line: #2e333d;
      --accent: #8ab4f8;
      --accent-text: #0b1a33;
      --ok: #81c995;
      --ok-bg: #1d3325;
      --warn: #fdd663;
      --warn-bg: #3a3020;
      --bad: #f28b82;
      --bad-bg: #3b2322;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 4px 0 2px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin: 12px 0;
  }
  .big { font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
  .note { border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: .95rem; }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  button {
    width: 100%;
    font: inherit;
    font-weight: 600;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  #judge { margin-top: 8px; }
  #msg { min-height: 1.7em; text-align: center; margin: 6px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; padding-top: 0; }
  .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .badge { font-size: .8rem; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  a { color: var(--accent); }
  .links a { display: inline-block; margin-left: 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  button.small { width: auto; padding: 6px 14px; font-size: .9rem; }
  button.plain { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.ok { background: var(--ok); color: var(--card); }
  .books li .row button { margin-top: 4px; }
  /* Review screen */
  #review { padding-bottom: 96px; }
  .head { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .zoom { position: relative; height: 45vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px;
    background: #fff; margin-top: 8px; }
  .zoom .page { position: relative; }
  .zoom img { display: block; width: 100%; height: auto; }
  .frame { position: absolute; border: 3px solid #d93025; border-radius: 4px; box-shadow: 0 0 0 2px #fff; }
  .read { font-size: 1.15rem; line-height: 2; padding: 10px 12px; border-radius: 10px; background: var(--bg);
    margin-top: 8px; unicode-bidi: isolate; overflow-wrap: anywhere; max-height: 40vh; overflow: auto; }
  .read .ctx { color: var(--muted); }
  .read mark { background: #ffe58a; color: #1d2433; padding: 0 2px; border-radius: 4px; }
  .read .gap { color: #d93025; font-weight: 700; }
  .choices button { margin-top: 8px; }
  .minor { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .minor button { flex: 1 1 auto; }
  textarea { width: 100%; min-height: 6em; font: inherit; font-size: 18px; line-height: 1.8; padding: 10px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .fills { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .fills button { width: auto; flex: 0 1 auto; padding: 6px 10px; font-size: .9rem; font-weight: 500;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); text-align: start;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .sendbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px; }
  .sendbar > div { max-width: 640px; margin: 0 auto; }
  .helper-line { width: 100%; font: inherit; font-size: .8rem; direction: ltr; padding: 8px; margin: 6px 0;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .act { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .act label { display: block; margin-top: 6px; }
  .act select { width: 100%; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); }
  .act button { margin-top: 10px; }
  details { margin-top: 10px; }
  .tag { display: inline-block; font-size: .8rem; padding: 0 8px; border-radius: 999px; background: var(--ok-bg);
    color: var(--ok); margin-inline-start: 6px; }
</style>
</head>
<body>
<main id="home">
  <h1>تحويل الكتب</h1>
  <div class="muted" id="sub"></div>

  <section class="card" id="now"></section>
  <section class="card" id="queue"></section>

  <section class="card" id="reviews" hidden></section>

  <section class="card" id="helper" hidden></section>

  <button id="check" type="button">افحص الآن</button>
  <button id="judge" type="button">اعرض على الحكّام الآن</button>
  <p id="msg" class="muted" role="status"></p>

  <section class="card">
    <h2>آخر الكتب</h2>
    <ul id="recent"></ul>
  </section>

  <section class="card muted" id="foot"></section>
</main>

<main id="review" hidden>
  <div class="head">
    <button id="rv-back" class="small plain" type="button">رجوع</button>
    <span class="muted" id="rv-count"></span>
  </div>
  <div class="big" id="rv-title"></div>
  <div class="bar"><span id="rv-bar" style="width:0%"></span></div>
  <div id="rv-body"></div>
  <p id="rv-msg" class="muted" role="status"></p>
  <div class="sendbar">
    <div>
      <div id="rv-saving" class="muted"></div>
      <button id="rv-send" type="button">أرسل التصحيحات</button>
    </div>
  </div>
</main>

<script>
  var INITIAL = <?!= initialJson ?>;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function link(href, text) {
    var a = el('a', '', text);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  // Arabic counted nouns: 1 دقيقة، 2 دقيقتان، 3-10 دقائق، 11+ دقيقة.
  function count(n, one, two, few, many) {
    if (n === 1) return one;
    if (n === 2) return two;
    if (n >= 3 && n <= 10) return n + ' ' + few;
    return n + ' ' + many;
  }

  function duration(minutes) {
    if (minutes < 1) return 'أقل من دقيقة';
    if (minutes < 60) return count(minutes, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');
    var h = Math.floor(minutes / 60), m = minutes % 60;
    var text = count(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة');
    return m ? text + ' و' + count(m, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة') : text;
  }

  function when(iso, timeOnly) {
    if (!iso) return '';
    var d = new Date(iso);
    try {
      var opts = { calendar: 'gregory', numberingSystem: 'latn', hour: '2-digit', minute: '2-digit' };
      if (!timeOnly) { opts.day = 'numeric'; opts.month = 'long'; }
      return d.toLocaleString('ar', opts);
    } catch (e) {
      return iso.replace('T', ' ').slice(0, 16);
    }
  }

  function minutesSince(iso, nowIso) {
    return Math.max(0, Math.floor((Date.parse(nowIso) - Date.parse(iso)) / 60000));
  }

  function render(s) {
    var now = document.getElementById('now');
    var queue = document.getElementById('queue');
    var recent = document.getElementById('recent');
    var foot = document.getElementById('foot');
    var sub = document.getElementById('sub');
    now.textContent = '';
    queue.textContent = '';
    recent.textContent = '';
    foot.textContent = '';

    if (!s || !s.ok) {
      now.appendChild(el('div', 'note bad', 'تعذّر قراءة الحالة: ' + ((s && s.error) || 'خطأ غير معروف')));
      return;
    }
    sub.textContent = s.lastTick ? 'آخر فحص: قبل ' + duration(minutesSince(s.lastTick, s.now)) : 'لم يجرِ أي فحص بعد';

    if (!s.setUp) {
      now.appendChild(el('div', 'note warn', 'الإعداد لم يكتمل. شغّل الدالة setup من المحرر (الخطوة 4 في دليل الإعداد).'));
    }
    if (!s.hasToken) {
      now.appendChild(el('div', 'note bad', 'رمز GitHub غير موجود. أضف GITHUB_TOKEN (الخطوة 3 في دليل الإعداد).'));
    }

    // The book being converted.
    now.appendChild(el('h2', '', 'الآن'));
    var a = s.active;
    if (!a) {
      now.appendChild(el('div', 'big', 'لا يوجد كتاب قيد التحويل.'));
    } else {
      now.appendChild(el('div', 'big', '«' + a.title + '»'));
      if (a.stage === 'queued') {
        now.appendChild(el('div', '', 'ينتظر بدء التحويل.'));
        if (a.lastError) {
          now.appendChild(el('div', 'note warn', 'تعذّر بدء التحويل على GitHub، وسأحاول مرة أخرى تلقائياً. (' + a.lastError + ')'));
        }
      } else if (a.paused) {
        now.appendChild(el('div', '', 'متوقف حتى الغد: انتهت حصة القراءة المجانية لهذا اليوم.'));
        now.appendChild(el('div', '', 'يكمل تلقائياً نحو ' + when(a.resumeAt) + '. ما أُنجز محفوظ.'));
      } else {
        now.appendChild(el('div', '', 'قيد التحويل منذ ' + duration(a.minutes) +
          (a.attempts > 1 ? ' (المحاولة رقم ' + a.attempts + ')' : '') + '.'));
      }
      if (a.pagesTotal) {
        now.appendChild(el('div', 'muted', 'أُنجزت ' + a.pagesDone + ' من ' + a.pagesTotal + ' صفحة حتى آخر توقف.'));
        var bar = el('div', 'bar');
        var fill = el('span');
        fill.style.width = Math.min(100, Math.round(100 * a.pagesDone / a.pagesTotal)) + '%';
        bar.appendChild(fill);
        now.appendChild(bar);
      }
    }

    // Waiting books.
    queue.appendChild(el('h2', '', 'في الانتظار'));
    queue.appendChild(el('div', '', s.queued
      ? count(s.queued, 'كتاب واحد', 'كتابان', 'كتب', 'كتاباً') + ' في «1- جديد».'
      : 'لا توجد كتب في «1- جديد».'));
    if (s.uploading) {
      queue.appendChild(el('div', 'muted', 'منها ' + s.uploading + ' ما زال يُرفع أو أُضيف قبل دقائق.'));
    }
    if (s.unsupported && s.unsupported.length) {
      queue.appendChild(el('div', 'note warn', 'ملفات لن تُحوَّل لأن نوعها غير مدعوم (المدعوم: PDF و DOCX و TXT): ' +
        s.unsupported.join('، ')));
    }

    // Finished books.
    if (!s.recent.length) {
      recent.appendChild(el('li', 'muted', 'لا شيء بعد.'));
    }
    s.recent.forEach(function (j) {
      var li = el('li');
      var row = el('div', 'row');
      row.appendChild(el('span', 'title', j.title));
      var badge = j.stage === 'problem' ? el('span', 'badge bad', 'مشكلة')
        : j.incomplete ? el('span', 'badge warn', 'جاهز، فيه صفحات ناقصة')
        : el('span', 'badge ok', 'جاهز');
      row.appendChild(badge);
      li.appendChild(row);
      var meta = el('div', 'muted');
      meta.appendChild(document.createTextNode(when(j.finishedAt) + (j.reason ? ' — ' + j.reason : '') + ' '));
      if (j.url) meta.appendChild(link(j.url, j.stage === 'problem' ? 'الملف' : 'افتح الكتاب'));
      li.appendChild(meta);
      recent.appendChild(li);
    });

    renderReviews(s);
    renderHelper(s);

    // Folders and token.
    var links = el('div', 'links');
    if (s.links.inbox) links.appendChild(link(s.links.inbox, 'مجلد «1- جديد»'));
    if (s.links.ready) links.appendChild(link(s.links.ready, 'مجلد «3- جاهز»'));
    if (s.links.problem) links.appendChild(link(s.links.problem, 'مجلد «5- مشكلة»'));
    if (s.links.root) links.appendChild(link(s.links.root, 'كل المجلدات'));
    foot.appendChild(links);
    if (s.tokenExpires) {
      var days = Math.floor((Date.parse(s.tokenExpires) - Date.parse(s.now)) / 86400000);
      foot.appendChild(el('div', days <= 14 ? 'note warn' : '',
        'صلاحية رمز GitHub حتى ' + when(s.tokenExpires) + (days <= 14 ? ' — جدّده قريباً (الخطوة 7 في الدليل).' : '.')));
    }
  }

  function setMsg(text) { document.getElementById('msg').textContent = text; }

  function refresh(after) {
    google.script.run
      .withSuccessHandler(function (text) {
        var s = null;
        try { s = JSON.parse(text); } catch (e) { s = { ok: false, error: 'رد غير مفهوم' }; }
        LAST = s;
        render(s);
        if (after) after();
      })
      .withFailureHandler(function (err) { setMsg('تعذّر التحديث: ' + (err && err.message ? err.message : err)); })
      .getStatus();
  }

  document.getElementById('check').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    setMsg('جارٍ الفحص…');
    google.script.run
      .withSuccessHandler(function (result) {
        refresh(function () {
          btn.disabled = false;
          setMsg(result === 'busy' ? 'يوجد فحص يعمل الآن، حدّثت الصفحة.' : 'تم الفحص.');
        });
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        setMsg('تعذّر الفحص: ' + (err && err.message ? err.message : err));
      })
      .tick();
  });

  // Unsure pages go to the judges today, using what is left of their daily quota.
  document.getElementById('judge').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    setMsg('جارٍ الطلب…');
    google.script.run
      .withSuccessHandler(function (result) {
        refresh(function () {
          btn.disabled = false;
          setMsg(result === 'busy' ? 'يوجد فحص يعمل الآن، أعد المحاولة بعد دقيقة.'
            : result === 'nothing to judge' ? 'لا يوجد كتاب فيه صفحات مشكوك فيها تنتظر الحكّام.'
            : /(judging|refining) [\w-]+: dispatched/.test(result) ? 'بدأت مراجعة الحكّام. تصلك رسالة حين تنتهي الجولة.'
            : 'تبدأ المراجعة بعد الكتاب الجاري تحويله أو الكتاب الجديد، تلقائياً.');
        });
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        setMsg('تعذّر الطلب: ' + (err && err.message ? err.message : err));
      })
      .judgeNow();
  });

  // ------------------------------------------------------------------------
  // Review by hand: one place at a time, its page image zoomed on it, and two
  // big buttons. Answers are saved as they are given (one call at a time); "send"
  // asks for the book to be rebuilt with them.
  // ------------------------------------------------------------------------
  var LAST = INITIAL;
  var RV = null;
  var RETRY = [3000, 10000, 30000];
  var HELP = ' إن تكرر الخطأ فافتح الرابط في نافذة خاصة بحسابك وحده.';

  function parse(text) {
    try { return JSON.parse(text) || { ok: false }; } catch (e) { return { ok: false, error: 'رد غير مفهوم' }; }
  }

  function errText(e) { return String(e && e.message ? e.message : e || 'خطأ غير معروف'); }

  function setRvMsg(text, bad) {
    var m = document.getElementById('rv-msg');
    m.textContent = text;
    m.className = bad ? 'note bad' : 'muted';
  }

  function show(which) {
    document.getElementById('home').hidden = which !== 'home';
    document.getElementById('review').hidden = which !== 'review';
  }

  function remember(rv) {
    // A copy of what is not saved yet, in case the page is closed or the network drops.
    try {
      var all = {};
      Object.keys(rv.saving || {}).forEach(function (k) { all[k] = rv.saving[k]; });
      Object.keys(rv.outbox).forEach(function (k) { all[k] = rv.outbox[k]; });
      localStorage.setItem('rv-' + rv.fileId, JSON.stringify(all));
    } catch (e) { /* private mode: nothing kept */ }
  }

  function remembered(fileId) {
    try { return JSON.parse(localStorage.getItem('rv-' + fileId) || '{}') || {}; } catch (e) { return {}; }
  }

  function renderReviews(s) {
    var box = document.getElementById('reviews');
    box.textContent = '';
    var list = (s && s.reviews) || [];
    box.hidden = !list.length;
    if (!list.length) return;
    box.appendChild(el('h2', '', 'مراجعة المشكوك فيه'));
    box.appendChild(el('div', 'muted', 'مواضع لم تقدر النماذج على حسمها: ترى كل موضع على صورة الصفحة وتجيب بزر.'));
    var ul = el('ul', 'books');
    list.forEach(function (b) {
      var li = el('li');
      var row = el('div', 'row');
      row.appendChild(el('span', 'title', b.title));
      if (b.open) row.appendChild(el('span', 'badge warn', count(b.open, 'موضع واحد', 'موضعان', 'مواضع', 'موضعاً')));
      li.appendChild(row);
      if (b.pending) li.appendChild(el('div', 'muted', 'أُرسلت إجاباتك، ويُحدَّث الكتاب قريباً وتصلك رسالة.'));
      if (b.note === 'orig-gone') li.appendChild(el('div', 'note warn', 'أعِد الملف الأصلي إلى «4- الأصل» ثم اضغط «أرسل الآن».'));
      if (b.note === 'no-data') li.appendChild(el('div', 'note warn', 'هذا الكتاب أقدم من خاصية المراجعة.'));
      if (b.note === 'failed') li.appendChild(el('div', 'note bad', 'تعذّر تطبيق إجاباتك. اضغط «أرسل الآن» للمحاولة مرة أخرى.'));
      var btns = el('div', 'row');
      if (b.open && b.note !== 'no-data') {
        var open = el('button', 'small', 'راجِع');
        open.type = 'button';
        open.addEventListener('click', function () { openReview(b.fileId); });
        btns.appendChild(open);
      }
      if (!b.pending && (b.saved > 0 || b.note === 'orig-gone' || b.note === 'failed')) {
        var send = el('button', 'small plain', 'أرسل الآن' + (b.saved ? ' (' + b.saved + ')' : ''));
        send.type = 'button';
        send.addEventListener('click', function () { sendReview(b.fileId, send); });
        btns.appendChild(send);
      }
      li.appendChild(btns);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  function openReview(fileId) {
    RV = null;
    show('review');
    document.getElementById('rv-title').textContent = '';
    document.getElementById('rv-count').textContent = '';
    document.getElementById('rv-body').textContent = '';
    setRvMsg('جارٍ التحميل…');
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        if (!r.ok) return setRvMsg('تعذّر فتح المراجعة: ' + (r.error || '') + '.' + HELP, true);
        start(fileId, r);
      })
      .withFailureHandler(function (err) { setRvMsg('تعذّر فتح المراجعة: ' + errText(err) + '.' + HELP, true); })
      .getReview(fileId);
  }

  function start(fileId, r) {
    var flat = [];
    r.pages.forEach(function (p) { p.items.forEach(function (it) { flat.push({ page: p, item: it }); }); });
    RV = { fileId: fileId, title: r.title, flat: flat, at: 0, done: {}, images: {}, waiting: {},
      outbox: {}, saving: null, tries: 0, saved: r.saved || 0, sent: r.sent || r.running };
    // Answers not saved last time (the page was closed or offline) go out now.
    var left = remembered(fileId);
    Object.keys(left).forEach(function (id) { RV.outbox[id] = left[id]; RV.done[id] = left[id].verdict; });
    document.getElementById('rv-title').textContent = '«' + r.title + '»';
    setRvMsg(r.sent || r.running ? 'أُرسلت إجابات سابقة لهذا الكتاب وهو قيد التحديث؛ يمكنك متابعة المراجعة.' : '');
    if (flat.length) showItem(); else finished();
    flush(RV);
  }

  function plain(t) {
    return String(t || '').replace(/^#+\s*/gm, '').replace(/^\|\s*/gm, '').replace(/\[\^([^\]\s]+)\]:?/g, '($1)')
      .replace(/\s+/g, ' ');
  }

  function short(t, n) {
    t = plain(t).trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  function isGap(it) { return it.kind === 'missing' && !String(it.core).trim(); }

  function showItem() {
    var cur = RV.flat[RV.at];
    var it = cur.item, page = cur.page;
    var body = document.getElementById('rv-body');
    body.textContent = '';
    document.getElementById('rv-count').textContent =
      'الموضع ' + (RV.at + 1) + ' من ' + RV.flat.length + ' · صفحة ' + page.page + ' من الأصل';
    document.getElementById('rv-bar').style.width = Math.round(100 * RV.at / RV.flat.length) + '%';

    var zoom = el('div', 'zoom');
    zoom.dir = 'ltr';
    var holder = el('div', 'page');
    var img = el('img');
    img.alt = 'صفحة ' + page.page;
    holder.appendChild(img);
    zoom.appendChild(holder);
    body.appendChild(zoom);
    var under = el('div', 'row');
    var note = el('span', 'muted', page.img ? 'تحميل الصورة…' : 'لا توجد صورة لهذه الصفحة.');
    under.appendChild(note);
    var full = false;
    var whole = el('button', 'small plain', 'الصفحة كاملة');
    whole.type = 'button';
    whole.addEventListener('click', function () {
      full = !full;
      whole.textContent = full ? 'كبّر على الموضع' : 'الصفحة كاملة';
      view(zoom, holder, page, it, full);
    });
    if (it.located) under.appendChild(whole);
    body.appendChild(under);
    if (page.img) {
      image(page.img, function (src) {
        if (!RV || RV.flat[RV.at] !== cur) return;
        if (!src) { note.textContent = 'تعذّر تحميل الصورة.'; return; }
        img.src = src;
        note.textContent = it.kind === 'page' ? 'لم أجد موضعاً محدداً في هذه الصفحة؛ قارنها كلها بالأصل.'
          : it.located ? 'الموضع في المربع الأحمر.' : 'لم أحدد الموضع بدقة: ابحث عنه في الصفحة.';
        view(zoom, holder, page, it, full);
      });
    }
    prefetch();

    var head = el('h2', '', 'ما قرأه البرنامج');
    if (it.hint === 'likely-ok') head.appendChild(el('span', 'tag', 'غالباً صحيح'));
    body.appendChild(head);
    var read = el('div', 'read');
    read.dir = 'auto';
    if (it.kind === 'page') {
      read.appendChild(el('span', '', plain(it.core)));
    } else {
      read.appendChild(el('span', 'ctx', plain(it.before)));
      if (isGap(it)) read.appendChild(el('span', 'gap', ' ▼ يبدو أن سطراً سقط هنا ▼ '));
      else read.appendChild(el('mark', '', plain(it.core)));
      read.appendChild(el('span', 'ctx', plain(it.after)));
    }
    body.appendChild(read);
    if (isGap(it) && it.options.length) {
      body.appendChild(el('div', 'muted', 'السطر في الصورة كما قرأته قراءة أخرى: ' + short(it.options[0].text, 200)));
    }

    var choices = el('div', 'choices');
    var keepText = it.hint === 'header' ? '✓ هذه ترويسة، لا شيء ناقص'
      : isGap(it) ? '✓ شكّك في غير محله — لا شيء ناقص' : '✓ شكّك في غير محله — القراءة صحيحة';
    var keep = el('button', 'ok', keepText);
    keep.type = 'button';
    keep.addEventListener('click', function () { answer('keep'); });
    var fix = el('button', '', '✎ شكّك في محله — الصواب هو…');
    fix.type = 'button';
    fix.addEventListener('click', function () { editor(cur, choices); });
    choices.appendChild(keep);
    choices.appendChild(fix);
    body.appendChild(choices);

    var minor = el('div', 'minor');
    [['تخطَّ', function () { go(RV.at + 1); }],
     ['السابق', function () { go(RV.at - 1); }],
     ['كل ما بقي في هذه الصفحة صحيح', rest]].forEach(function (b) {
      var btn = el('button', 'small plain', b[0]);
      btn.type = 'button';
      if (b[0] === 'السابق') btn.disabled = RV.at === 0;
      btn.addEventListener('click', b[1]);
      minor.appendChild(btn);
    });
    body.appendChild(minor);
    if (RV.done[it.id]) body.appendChild(el('div', 'muted', 'أجبت عن هذا الموضع؛ إجابتك الجديدة تحل محل السابقة.'));
    updateSend();
  }

  // Zoom so the place's column fills the box, then scroll to the place.
  function view(zoom, holder, page, it, full) {
    var w = zoom.clientWidth || 360;
    var col = !full && it.located && it.col ? it.col : [0, page.w];
    var scale = w / Math.max(1, col[1] - col[0]);
    holder.style.width = Math.round(page.w * scale) + 'px';
    (holder.frames || []).forEach(function (f) { f.style.display = 'none'; });
    holder.frames = (it.boxes || []).map(function (b) {
      var f = el('div', 'frame');
      f.style.left = Math.round(b[0] * scale - 5) + 'px';
      f.style.top = Math.round(b[1] * scale - 5) + 'px';
      f.style.width = Math.round((b[2] - b[0]) * scale + 10) + 'px';
      f.style.height = Math.round((b[3] - b[1]) * scale + 10) + 'px';
      holder.appendChild(f);
      return f;
    });
    var first = (it.boxes || [])[0];
    zoom.scrollLeft = Math.round(col[0] * scale);
    zoom.scrollTop = first && !full ? Math.max(0, Math.round(first[1] * scale - (zoom.clientHeight || 300) / 3)) : 0;
  }

  function image(name, done) {
    var rv = RV;
    if (rv.images[name]) return done(rv.images[name]);
    if (rv.waiting[name]) return rv.waiting[name].push(done);
    rv.waiting[name] = [done];
    var finish = function (src) {
      if (src) rv.images[name] = src;
      var list = rv.waiting[name] || [];
      delete rv.waiting[name];
      list.forEach(function (f) { f(src); });
    };
    google.script.run
      .withSuccessHandler(function (text) { var r = parse(text); finish(r.ok ? r.src : ''); })
      .withFailureHandler(function () { finish(''); })
      .getReviewImage(rv.fileId, name);
  }

  // The images of the next two pages are fetched ahead, so moving on is quick.
  function prefetch() {
    var seen = {}, n = 0;
    seen[RV.flat[RV.at].page.img] = true;
    for (var k = RV.at + 1; k < RV.flat.length && n < 2; k++) {
      var name = RV.flat[k].page.img;
      if (!name || seen[name]) continue;
      seen[name] = true;
      n++;
      image(name, function () {});
    }
  }

  function editor(cur, choices) {
    var it = cur.item;
    choices.textContent = '';
    var box = el('div');
    box.appendChild(el('div', 'muted', isGap(it) ? 'اكتب السطر الساقط كما في الصورة:'
      : it.kind === 'page' ? 'صحّح نص الصفحة كما في الصورة:' : 'اكتب الصواب مكان الكلام المظلل:'));
    var ta = el('textarea');
    ta.dir = 'rtl';
    var first = isGap(it) ? (it.options[0] ? it.options[0].text : '') : it.core;
    if (isGap(it) && it.hint === 'heading') first = '## ' + first;
    ta.value = first;
    var fills = el('div', 'fills');
    var fill = function (label, value) {
      var b = el('button', '', label);
      b.type = 'button';
      b.addEventListener('click', function () { ta.value = value; });
      fills.appendChild(b);
    };
    it.options.forEach(function (o) {
      if (o.label === 'other') fill(o.text ? 'القراءة الأخرى: ' + short(o.text, 40) : 'القراءة الأخرى: (لا شيء)', o.text);
      if (o.label === 'ocr') fill('القراءة الآلية: ' + short(o.text, 40), o.text);
    });
    if (String(it.core).trim()) fill('احذف المظلل', '');
    if (isGap(it)) {
      var h = el('button', '', 'عنوان');
      h.type = 'button';
      h.addEventListener('click', function () {
        ta.value = /^#+\s/.test(ta.value) ? ta.value.replace(/^#+\s*/, '') : '## ' + ta.value;
      });
      fills.appendChild(h);
    }
    box.appendChild(fills);
    box.appendChild(ta);
    var save = el('button', '', 'حفظ والتالي');
    save.type = 'button';
    save.addEventListener('click', function () { answer('fix', ta.value); });
    var cancel = el('button', 'plain', 'إلغاء');
    cancel.type = 'button';
    cancel.addEventListener('click', showItem);
    box.appendChild(save);
    box.appendChild(cancel);
    choices.appendChild(box);
  }

  function answer(verdict, text) {
    var cur = RV.flat[RV.at];
    var it = cur.item;
    var a = { page: cur.page.page, kind: it.kind, fp: it.fp, before: it.before, core: it.core, after: it.after,
      pos: it.pos, base: cur.page.base, place: it.place || '', verdict: verdict };
    if (verdict === 'fix') a.text = String(text || '');
    queue(it.id, a);
    RV.done[it.id] = verdict;
    go(RV.at + 1);
  }

  // "The rest of this page is right": the places of the page not answered yet.
  function rest() {
    var page = RV.flat[RV.at].page.page;
    var left = RV.flat.filter(function (x) { return x.page.page === page && !RV.done[x.item.id]; }).slice(0, 25);
    if (left.length) {
      queue('p' + page + '-rest-' + Date.now().toString(36), { kind: 'rest', page: page, verdict: 'keep',
        ids: left.map(function (x) { return x.item.id; }), fps: left.map(function (x) { return x.item.fp; }) });
      left.forEach(function (x) { RV.done[x.item.id] = 'keep'; });
    }
    var k = RV.at;
    while (k < RV.flat.length && RV.flat[k].page.page === page) k++;
    go(k);
  }

  function go(k) {
    if (k < 0) return;
    RV.at = Math.min(k, RV.flat.length);
    if (RV.at >= RV.flat.length) finished(); else showItem();
  }

  function finished() {
    var body = document.getElementById('rv-body');
    body.textContent = '';
    document.getElementById('rv-bar').style.width = '100%';
    document.getElementById('rv-count').textContent = '';
    var answered = RV.flat.filter(function (x) { return RV.done[x.item.id]; }).length;
    var skipped = RV.flat.length - answered;
    body.appendChild(el('div', 'big', RV.flat.length ? 'انتهت المواضع.' : 'لا مواضع تنتظر المراجعة الآن.'));
    if (RV.flat.length) body.appendChild(el('div', '', 'اضغط «أرسل التصحيحات» في الأسفل ليُحدَّث الكتاب بإجاباتك.'));
    if (skipped) {
      body.appendChild(el('div', 'muted', 'تخطّيت ' + count(skipped, 'موضعاً واحداً', 'موضعين', 'مواضع', 'موضعاً') +
        '؛ تجدها مرة أخرى في المراجعة القادمة.'));
      var back = el('button', 'small plain', 'ارجع إلى أول موضع لم تُجب عنه');
      back.type = 'button';
      back.addEventListener('click', function () {
        for (var k = 0; k < RV.flat.length; k++) if (!RV.done[RV.flat[k].item.id]) return go(k);
      });
      body.appendChild(back);
    }
    updateSend();
  }

  function queue(id, a) {
    RV.outbox[id] = a;
    remember(RV);
    flush(RV);
  }

  // One saveAnswers call at a time, carrying everything waiting; tried again after
  // 3, 10 and 30 seconds, then the user is asked.
  function flush(rv) {
    if (rv.saving || !Object.keys(rv.outbox).length) return updateSend();
    var batch = rv.outbox;
    rv.outbox = {};
    rv.saving = batch;
    updateSend();
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        if (!r.ok) return failed(rv, batch, r.busy ? 'مشغول بفحص آخر' : r.error);
        rv.saving = null;
        rv.tries = 0;
        rv.stuck = false;
        rv.saved = r.pending || 0;
        remember(rv);
        flush(rv);
      })
      .withFailureHandler(function (err) { failed(rv, batch, errText(err)); })
      .saveAnswers(rv.fileId, JSON.stringify(batch));
  }

  function failed(rv, batch, why) {
    Object.keys(batch).forEach(function (id) { if (!rv.outbox[id]) rv.outbox[id] = batch[id]; });
    rv.saving = null;
    remember(rv);
    if (rv.tries < RETRY.length) {
      setTimeout(function () { flush(rv); }, RETRY[rv.tries++]);
    } else {
      rv.stuck = why || 'خطأ غير معروف';
    }
    updateSend();
  }

  function updateSend() {
    if (!RV) return;
    var waiting = Object.keys(RV.outbox).length + (RV.saving ? Object.keys(RV.saving).length : 0);
    var btn = document.getElementById('rv-send');
    var info = document.getElementById('rv-saving');
    var n = (RV.saved || 0) + waiting;
    btn.textContent = 'أرسل التصحيحات' + (n ? ' (' + n + ')' : '');
    btn.armed = false;
    btn.disabled = waiting > 0 || !n;
    info.className = RV.stuck ? 'note bad' : 'muted';
    info.textContent = RV.stuck ? 'لم تُحفظ ' + waiting + ' إجابة (' + RV.stuck + ').' + HELP
      : waiting ? 'جارٍ حفظ ' + waiting + ' إجابة…' : n ? 'إجاباتك محفوظة.' : '';
    if (RV.stuck && waiting) {
      var again = el('button', 'small plain', 'أعد المحاولة');
      again.type = 'button';
      again.addEventListener('click', function () { RV.stuck = false; RV.tries = 0; flush(RV); });
      info.appendChild(again);
    }
  }

  function sendReview(fileId, btn, after) {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (text) {
        var r = parse(text);
        btn.disabled = false;
        if (!r.ok) {
          (after ? setRvMsg : setMsg)(r.busy ? 'يوجد فحص يعمل الآن، أعد المحاولة بعد دقيقة.' : 'تعذّر الإرسال: ' + (r.error || '') + '.' + HELP, true);
          return;
        }
        var text2 = r.started ? 'بدأ تحديث الكتاب بإجاباتك، وتصلك رسالة حين يجهز (نحو نصف ساعة).'
          : r.nothing ? 'لا إجابات جديدة لإرسالها.'
          : 'يبدأ تحديث الكتاب تلقائياً بعد أن ينتهي الكتاب الجاري تحويله.';
        if (after) after();
        setMsg(text2);
        refresh();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        (after ? setRvMsg : setMsg)('تعذّر الإرسال: ' + errText(err) + '.' + HELP, true);
      })
      .sendReview(fileId);
  }

  function closeReview() {
    show('home');
    RV = null;
    refresh();
  }

  document.getElementById('rv-back').addEventListener('click', closeReview);
  document.getElementById('rv-send').addEventListener('click', function () {
    var btn = this;
    if (!RV || btn.disabled) return;
    if (!btn.armed) {
      btn.armed = true;
      btn.textContent = 'تأكيد: أرسل الآن';
      setRvMsg(LAST && LAST.active ? 'يُحدَّث الكتاب بعد أن ينتهي الكتاب الجاري تحويله. اضغط مرة أخرى للتأكيد.'
        : 'يُحدَّث الكتاب خلال نصف ساعة تقريباً وتصلك رسالة. اضغط مرة أخرى للتأكيد.');
      return;
    }
    var fileId = RV.fileId;
    sendReview(fileId, btn, function () { show('home'); RV = null; });
  });

  // Keep the page current while it is open (not during a review), and when the user comes back to it.
  setInterval(function () { if (!document.hidden && !RV) refresh(); }, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !RV) refresh(); });

  // ------------------------------------------------------------------------
  // The helper on the user's computer: its install line, its own lines and
  // buttons (from its status file), and the requests it has not finished.
  // ------------------------------------------------------------------------
  var PICKS = {};

  function renderHelper(s) {
    var box = document.getElementById('helper');
    box.textContent = '';
    var h = s.helper;
    box.hidden = !h;
    if (!h) return;
    box.appendChild(el('h2', '', 'المساعد على جهازك'));
    if (h.error) box.appendChild(el('div', 'note warn', h.error));
    if (h.connected) {
      box.appendChild(el('div', '', 'متصل (آخر اتصال قبل ' + duration(h.minutes) + ').'));
    } else if (h.seen) {
      box.appendChild(el('div', '', 'غير متصل منذ ' + duration(h.minutes) + '. يعمل حين يكون جهازك مفتوحاً.'));
    } else {
      box.appendChild(el('div', '', 'لم يُثبَّت بعد على جهازك.'));
    }
    (h.lines || []).forEach(function (l) {
      var d = el('div', l.kind ? 'note ' + l.kind : '', l.text);
      if (l.link && /^https:\/\/(drive|docs)\.google\.com\//.test(l.link)) {
        d.appendChild(document.createTextNode(' '));
        d.appendChild(link(l.link, l.linkText || 'افتح'));
      }
      box.appendChild(d);
    });
    (h.pending || []).forEach(function (p) {
      box.appendChild(el('div', 'note warn', (p.id === h.busy ? 'يعمل الآن: ' : 'ينتظر المساعد: ') +
        (p.label || p.action) + ' (طُلب ' + when(p.at) + ')'));
    });
    (h.actions || []).forEach(function (a) { box.appendChild(helperAction(a)); });

    if (h.line) {
      var holder = box;
      if (h.seen) {
        holder = el('details');
        holder.appendChild(el('summary', 'muted', 'إعادة التثبيت'));
        box.appendChild(holder);
      }
      holder.appendChild(el('div', 'muted', 'على جهازك: افتح PowerShell، والصق هذا السطر، ثم اضغط Enter (مرة واحدة فقط):'));
      var input = el('input', 'helper-line');
      input.readOnly = true;
      input.value = h.line;
      input.addEventListener('focus', function () { input.select(); });
      holder.appendChild(input);
      var copy = el('button', 'small', 'انسخ السطر');
      copy.type = 'button';
      copy.addEventListener('click', function () {
        input.focus();
        input.select();
        var done = function () { copy.textContent = 'نُسخ ✓'; };
        try {
          if (document.execCommand('copy')) return done();
        } catch (e) { /* try the other way */ }
        if (navigator.clipboard) navigator.clipboard.writeText(h.line).then(done, function () {
          copy.textContent = 'انسخه يدوياً (Ctrl+C)';
        });
      });
      holder.appendChild(copy);
    }
  }

  // One button of the helper's, with its choices: {id, label, button, options: [{name, label, choices: [{value, label}]}]}.
  function helperAction(a) {
    var box = el('div', 'act');
    box.appendChild(el('div', 'title', String(a.label || '')));
    if (a.note) box.appendChild(el('div', 'muted', String(a.note)));
    var selects = [];
    (Array.isArray(a.options) ? a.options : []).forEach(function (o) {
      var lab = el('label', '', String(o.label || ''));
      var sel = el('select');
      (Array.isArray(o.choices) ? o.choices : []).forEach(function (c) {
        var opt = el('option', '', String(c.label || c.value));
        opt.value = String(c.value);
        sel.appendChild(opt);
      });
      var key = a.id + '/' + o.name;
      if (PICKS[key] !== undefined) sel.value = PICKS[key];
      sel.addEventListener('change', function () { PICKS[key] = sel.value; });
      lab.appendChild(sel);
      box.appendChild(lab);
      selects.push({ name: String(o.name), sel: sel });
    });
    var btn = el('button', '', String(a.button || 'ابدأ'));
    btn.type = 'button';
    btn.addEventListener('click', function () {
      var choices = {};
      var words = [String(a.label || '')];
      selects.forEach(function (x) {
        choices[x.name] = x.sel.value;
        var opt = x.sel.options[x.sel.selectedIndex];
        if (opt) words.push(opt.textContent);
      });
      btn.disabled = true;
      setMsg('جارٍ إرسال الطلب…');
      google.script.run
        .withSuccessHandler(function (text) {
          var r = parse(text);
          btn.disabled = false;
          setMsg(r.ok ? 'أُرسل الطلب. يبدأ المساعد خلال دقائق إن كان جهازك مفتوحاً.' : 'تعذّر الطلب: ' + (r.error || ''));
          refresh();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          setMsg('تعذّر الطلب: ' + errText(err));
        })
        .helperRequest(JSON.stringify({ action: String(a.id), choices: choices, label: words.join(' — ') }));
    });
    box.appendChild(btn);
    return box;
  }

  render(INITIAL);
  if (INITIAL && INITIAL.openReview) openReview(INITIAL.openReview);
</script>
</body>
</html>
