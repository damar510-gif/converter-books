name: Convert Book to EPUB

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to the input file in the repository (leave empty if using file_url)'
        required: false
        type: string
      file_url:
        description: 'Direct download URL for the book file (optional)'
        required: false
        type: string
      title:
        description: 'Book title (optional, defaults to the file name)'
        required: false
        type: string
      pages:
        description: 'Pages to convert, e.g. 1-20 (empty = whole book)'
        required: false
        type: string
      compare_models:
        description: 'Testing only: compare these models (comma separated) on the given pages instead of converting'
        required: false
        type: string
      text_check_models:
        description: 'Testing only: text models (provider:model, comma separated) that look for misread words'
        required: false
        type: string
      # Set by the Drive inbox script (apps-script/Code.gs, docs/drive-inbox.md).
      drive_file_id:
        description: 'Drive inbox only: Drive file ID'
        required: false
        type: string
      drive_token:
        description: 'Drive inbox only: short-lived Drive token (never printed)'
        required: false
        type: string
      drive_file_name:
        description: 'Drive inbox only: original file name'
        required: false
        type: string
      result_dir:
        description: 'Folder in the results branch (default: the book name)'
        required: false
        type: string
      review:
        description: 'Drive inbox only: the answers file ID, with ":only" to rebuild the book from saved pages only'
        required: false
        type: string
      # The helper on the user's computer (docs/helper-boxes-plan.md).
      helper:
        description: 'Drive inbox only: the book''s helper folder ID, with ":transcribe", ":read", ":settle" or ":import"'
        required: false
        type: string
      judge:
        description: 'Drive inbox only: the file ID of the helper models'' verdicts on the unsure places'
        required: false
        type: string
      # The status page's live view (live.py, docs/drive-inbox.md).
      live:
        description: 'Drive inbox only: the Drive file ID where the run writes what it is doing, every few seconds'
        required: false
        type: string

permissions:
  contents: write
  # GitHub Models (model comparison only).
  models: read

# One book at a time: books share the same daily Gemini quotas.
concurrency:
  group: convert
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The status page shows at once that the run has started (live.py needs no package).
      - name: Tell the status page
        if: inputs.live != ''
        env:
          LIVE: ${{ inputs.live }}
        run: |
          if [[ "$LIVE" =~ ^[A-Za-z0-9_-]{10,100}$ ]]; then
            DRIVE_TOKEN=$(jq -r '.inputs.drive_token // ""' "$GITHUB_EVENT_PATH")
            [ -n "$DRIVE_TOKEN" ] && echo "::add-mask::$DRIVE_TOKEN"
            echo "LIVE_FILE=$LIVE" >> "$GITHUB_ENV"
            DRIVE_TOKEN="$DRIVE_TOKEN" python live.py mark setup || true
          fi

      # The runner's package lists usually do: "apt-get update" first sometimes hangs ten
      # minutes on a slow mirror (2026-10-22 and 23) before any page is read. It runs only
      # when the install fails without it.
      - name: Install Pandoc and Tesseract
        timeout-minutes: 25
        run: |
          PKGS="pandoc tesseract-ocr tesseract-ocr-ara"
          if ! sudo timeout 300 apt-get install -y -q $PKGS; then
            sudo timeout 600 apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo timeout 600 apt-get install -y -q $PKGS
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pick the book file
        env:
          FILE_URL: ${{ inputs.file_url }}
          INPUT_FILE: ${{ inputs.input_file }}
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          DRIVE_FILE_NAME: ${{ inputs.drive_file_name }}
          RESULT_DIR_INPUT: ${{ inputs.result_dir }}
        run: |
          if [ -n "$DRIVE_FILE_ID" ]; then
            # The token is read from the event file rather than an expression, so it is
            # never written into the log, and it is masked before anything else runs.
            DRIVE_TOKEN=$(jq -r '.inputs.drive_token // ""' "$GITHUB_EVENT_PATH")
            [ -n "$DRIVE_TOKEN" ] && echo "::add-mask::$DRIVE_TOKEN"
            # Only the file name, without characters that break paths or GITHUB_ENV lines.
            NAME=$(basename "${DRIVE_FILE_NAME:-book.pdf}" | tr -d '\r\n*?[]\\')
            [ -n "$NAME" ] || NAME=book.pdf
            mkdir -p incoming
            TARGET_FILE="incoming/$NAME"
            echo "RESULT_DIR=${RESULT_DIR_INPUT:-drive-$DRIVE_FILE_ID}" | tr -d '/' >> "$GITHUB_ENV"
            if ! curl -fsSL --retry 3 -H "Authorization: Bearer $DRIVE_TOKEN" \
                 "https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media&supportsAllDrives=true" \
                 -o "$TARGET_FILE"; then
              echo "FAIL_REASON=download" >> "$GITHUB_ENV"
              echo "Error: could not download the book from Google Drive."
              exit 1
            fi
          elif [ -n "$FILE_URL" ]; then
            FILENAME=$(basename "${FILE_URL%%\?*}")
            if [[ ! "$FILENAME" =~ \.(pdf|docx|txt)$ ]]; then
              FILENAME="downloaded_book.pdf"
            fi
            wget -q -O "$FILENAME" "$FILE_URL"
            TARGET_FILE="$FILENAME"
          else
            TARGET_FILE="$INPUT_FILE"
          fi
          if [ -z "$TARGET_FILE" ] || [ ! -f "$TARGET_FILE" ]; then
            echo "FAIL_REASON=no-file" >> "$GITHUB_ENV"
            echo "Error: provide input_file (a file in the repository) or file_url."
            exit 1
          fi
          BASENAME=$(basename "$TARGET_FILE")
          {
            echo "TARGET_FILE=$TARGET_FILE"
            echo "EPUB_OUTPUT=${BASENAME%.*}.epub"
            echo "BOOK_HASH=$(sha256sum "$TARGET_FILE" | cut -c1-16)"
          } >> "$GITHUB_ENV"
          if [ -z "$DRIVE_FILE_ID" ]; then
            echo "RESULT_DIR=${RESULT_DIR_INPUT:-${BASENAME%.*}}" | tr -d '/' >> "$GITHUB_ENV"
          fi

      # The pages the user already answered about (human.json in the results branch) and,
      # from the Drive inbox, the file of their answers.
      - name: Restore review state
        if: inputs.compare_models == '' && inputs.text_check_models == '' && env.RESULT_DIR != ''
        env:
          REVIEW: ${{ inputs.review }}
          JUDGE: ${{ inputs.judge }}
        run: |
          mkdir -p review-in
          # Checkout fetched only this branch.
          if git fetch -q --depth 1 origin +refs/heads/results:refs/remotes/origin/results 2>/dev/null; then
            git show "origin/results:$RESULT_DIR/human.json" > review-in/human.json 2>/dev/null || true
            # Answers a judge model gave when the user asked for one.
            git show "origin/results:$RESULT_DIR/review/judge-answers.json" > review-in/judge.json 2>/dev/null || true
          fi
          [ -s review-in/human.json ] || rm -f review-in/human.json
          if [ ! -s review-in/judge.json ] || ! jq -e .answers review-in/judge.json >/dev/null 2>&1; then
            rm -f review-in/judge.json
          fi
          ANSWERS_ID="${REVIEW%%:*}"
          if [[ "$ANSWERS_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            # Read from the event file like the book's own download, never printed.
            DRIVE_TOKEN=$(jq -r '.inputs.drive_token // ""' "$GITHUB_EVENT_PATH")
            [ -n "$DRIVE_TOKEN" ] && echo "::add-mask::$DRIVE_TOKEN"
            if curl -fsSL --retry 3 -H "Authorization: Bearer $DRIVE_TOKEN" \
                 "https://www.googleapis.com/drive/v3/files/${ANSWERS_ID}?alt=media&supportsAllDrives=true" \
                 -o review-in/answers.json && jq -e .answers review-in/answers.json >/dev/null; then
              echo "Answers: $(jq '.answers | length' review-in/answers.json)"
            else
              echo "::warning::Could not read the answers file."
              rm -f review-in/answers.json
            fi
          fi
          if [[ "$REVIEW" == *":only" ]]; then echo "REVIEW_ONLY=1" >> "$GITHUB_ENV"; fi
          # The helper models' verdicts join the saved ones (the newer verdict on a place
          # wins); the user's own answers still win over both.
          if [[ "$JUDGE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            DRIVE_TOKEN=$(jq -r '.inputs.drive_token // ""' "$GITHUB_EVENT_PATH")
            [ -n "$DRIVE_TOKEN" ] && echo "::add-mask::$DRIVE_TOKEN"
            if curl -fsSL --retry 3 -H "Authorization: Bearer $DRIVE_TOKEN" \
                 "https://www.googleapis.com/drive/v3/files/${JUDGE}?alt=media&supportsAllDrives=true" \
                 -o review-in/helper-judge.json && jq -e '.answers | type == "object"' review-in/helper-judge.json >/dev/null; then
              if [ -f review-in/judge.json ]; then
                jq -s '{v: 1, answers: (.[0].answers + .[1].answers)}' review-in/judge.json review-in/helper-judge.json > review-in/merged.json
              else
                jq '{v: 1, answers: .answers}' review-in/helper-judge.json > review-in/merged.json
              fi
              mv review-in/merged.json review-in/judge.json
              echo "JUDGE_SAVE=1" >> "$GITHUB_ENV"
              echo "Helper verdicts: $(jq '.answers | length' review-in/helper-judge.json)"
            else
              echo "::warning::Could not read the helper's verdicts."
            fi
            rm -f review-in/helper-judge.json
          fi
          ls -l review-in

      # Pages already read in earlier runs are kept here, so a run stopped by the
      # daily limit continues tomorrow from where it stopped.
      - name: Restore saved progress
        id: restore
        if: env.BOOK_HASH != ''
        uses: actions/cache/restore@v4
        with:
          path: work
          key: ocr-${{ env.BOOK_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ocr-${{ env.BOOK_HASH }}-

      # GitHub deletes caches unused for 7 days, so every run also keeps a copy of
      # the progress in the "progress" release (internal; the repository is private).
      - name: Restore permanent progress copy
        if: env.BOOK_HASH != '' && steps.restore.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TMP=$(mktemp -d)
          if gh release download progress --repo "$GITHUB_REPOSITORY" -p "$BOOK_HASH.tgz" -D "$TMP" 2>/dev/null; then
            mkdir -p work && tar xzf "$TMP/$BOOK_HASH.tgz" -C work && echo "Progress restored from the permanent copy."
          else
            echo "No permanent copy of the progress."
          fi
          exit 0

      - name: Compare models
        if: inputs.compare_models != ''
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOOK_PAGES: ${{ inputs.pages }}
          MODELS: ${{ inputs.compare_models }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python compare_models.py "$TARGET_FILE" --pages "$BOOK_PAGES" --models "$MODELS" --out compare-out

      - name: Text models trial
        if: inputs.text_check_models != ''
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOOK_PAGES: ${{ inputs.pages }}
          MODELS: ${{ inputs.text_check_models }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python textcheck_trial.py "$TARGET_FILE" --pages "$BOOK_PAGES" --models "$MODELS" --out compare-out

      # Runs even when the comparison was cut short, so partial results are kept.
      - name: Save comparison
        if: always() && (inputs.compare_models != '' || inputs.text_check_models != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f compare-out/summary.md ] || exit 0
          cat compare-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TMP=$(mktemp -d)
          git clone -q --depth 1 --branch results "$URL" "$TMP"
          rm -rf "$TMP/compare" && mkdir -p "$TMP/compare" && cp compare-out/* "$TMP/compare/"
          cd "$TMP" && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Model comparison (run ${GITHUB_RUN_NUMBER})" && git push -q origin results

      - name: Run Conversion Script
        id: convert
        if: inputs.compare_models == '' && inputs.text_check_models == ''
        # Leaves time for the steps below to save progress and status.json.
        timeout-minutes: 300
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variables (Settings → Secrets and variables → Variables).
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_SECOND_MODEL: ${{ vars.GEMINI_SECOND_MODEL }}
          GEMINI_RESCUE_MODEL: ${{ vars.GEMINI_RESCUE_MODEL }}
          # The other free models (Flash): they read and settle once both Lite readers are out.
          GEMINI_EXTRA_MODELS: ${{ vars.GEMINI_EXTRA_MODELS || vars.GEMINI_ARBITER_MODELS }}
          BOOK_TITLE: ${{ inputs.title }}
          BOOK_PAGES: ${{ inputs.pages }}
          HELPER: ${{ inputs.helper }}
          PYTHONUNBUFFERED: '1'
        run: |
          set +e
          ARGS=(-o "$EPUB_OUTPUT" --work-dir work --report report.md --status status.json --keep-markdown
                --review-out review-out)
          # Every mode Code.gs sends (helperInput_): the helper's models read and settle, only
          # read, only settle, or their work so far is imported.
          if [[ "$HELPER" =~ ^[A-Za-z0-9_-]+:(transcribe|read|settle|import)$ ]]; then
            ARGS+=(--helper "$HELPER")
          fi
          # The live view: what the run does, written to the user's Drive every few seconds.
          [ -n "$LIVE_FILE" ] && ARGS+=(--live "$LIVE_FILE")
          if [[ " ${ARGS[*]} " == *" --helper "* || -n "$LIVE_FILE" ]]; then
            # The converter exchanges files with the helper's folder, and writes the live
            # file, with the run's Drive token, read from the event file and masked like the
            # book's own download.
            DRIVE_TOKEN=$(jq -r '.inputs.drive_token // ""' "$GITHUB_EVENT_PATH")
            [ -n "$DRIVE_TOKEN" ] && echo "::add-mask::$DRIVE_TOKEN"
            export DRIVE_TOKEN
          fi
          [ -n "$BOOK_TITLE" ] && ARGS+=(--title "$BOOK_TITLE")
          [ -n "$BOOK_PAGES" ] && ARGS+=(--pages "$BOOK_PAGES")
          [ -f review-in/answers.json ] && ARGS+=(--answers review-in/answers.json)
          [ -f review-in/judge.json ] && ARGS+=(--judge-answers review-in/judge.json)
          [ -f review-in/human.json ] && ARGS+=(--human review-in/human.json)
          [ -n "$REVIEW_ONLY" ] && ARGS+=(--review-only)
          python converter.py "$TARGET_FILE" "${ARGS[@]}"
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Save progress
        if: always() && inputs.compare_models == '' && inputs.text_check_models == '' && env.BOOK_HASH != ''
        uses: actions/cache/save@v4
        with:
          path: work
          key: ocr-${{ env.BOOK_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save permanent progress copy
        if: always() && inputs.compare_models == '' && inputs.text_check_models == '' && env.BOOK_HASH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d work ] && [ -n "$(ls -A work)" ] || exit 0
          gh release view progress --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create progress --repo "$GITHUB_REPOSITORY" --prerelease --target results \
              --title "Saved progress" --notes "Internal: page-by-page progress of each book (one file per book)."
          tar czf "$BOOK_HASH.tgz" -C work .
          # The cache still holds the progress, so a failed upload does not fail the run.
          gh release upload progress "$BOOK_HASH.tgz" --repo "$GITHUB_REPOSITORY" --clobber ||
            echo "::warning::Could not save the permanent progress copy."
          rm -f "$BOOK_HASH.tgz"

      - name: Upload EPUB Artifact
        if: always() && inputs.compare_models == '' && inputs.text_check_models == '' && env.EPUB_OUTPUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: converted-epub
          path: |
            ${{ env.EPUB_OUTPUT }}
            ${{ env.EPUB_OUTPUT }}.md
            report.md
            status.json
          if-no-files-found: warn

      # The book, its text, the report and status.json go to the "results" branch:
      # the Drive inbox script reads them from there, and they can be downloaded from
      # the repository page. status.json is written even when the run crashed.
      - name: Save to results branch
        if: always() && inputs.compare_models == '' && inputs.text_check_models == '' && env.RESULT_DIR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.convert.outputs.code }}
        run: |
          if [ ! -f status.json ]; then
            jq -n --arg reason "${FAIL_REASON:-crash (exit ${CODE:-none})}" \
              '{state: "failed", reason: $reason, epub: "", pages_total: 0, pages_done: 0,
                pages_unsure: [], pages_missing: [], pages_waiting: []}' > status.json
          fi
          jq --argjson id "$GITHUB_RUN_ID" --argjson n "$GITHUB_RUN_NUMBER" \
             --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '. + {run_id: $id, run_number: $n, updated_at: $at}' status.json > status.tmp && mv status.tmp status.json
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TMP=$(mktemp -d)
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git clone -q --depth 1 --branch results "$URL" "$TMP"
          else
            git init -q -b results "$TMP"
            git -C "$TMP" remote add origin "$URL"
          fi
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DIR="$TMP/$RESULT_DIR"
          mkdir -p "$DIR"
          rm -f "$DIR"/*.epub
          [ -n "$EPUB_OUTPUT" ] && [ -f "$EPUB_OUTPUT" ] && cp "$EPUB_OUTPUT" "$DIR/"
          [ -n "$EPUB_OUTPUT" ] && [ -f "$EPUB_OUTPUT.md" ] && cp "$EPUB_OUTPUT.md" "$DIR/text.md"
          [ -f report.md ] && cp report.md "$DIR/report.md"
          cp status.json "$DIR/status.json"
          # The places for the user to check, with their page images; written only by a
          # run that finished, so a crash leaves the previous ones.
          if [ -f review-out/items.json ]; then
            mkdir -p "$DIR/review"
            cp -n review-out/*.jpg "$DIR/review/" 2>/dev/null || true
            cp review-out/items.json "$DIR/review/items.json"
            jq -r '.pages[].img' review-out/items.json > review-out/keep.txt
            for f in "$DIR"/review/*.jpg; do
              [ -e "$f" ] || continue
              grep -qxF "$(basename "$f")" review-out/keep.txt || rm -f "$f"
            done
            if [ -f review-out/human.json ]; then cp review-out/human.json "$DIR/human.json"; fi
            if [ -f review-out/review-applied.json ]; then cp review-out/review-applied.json "$DIR/review/"; fi
            if [ -f review-in/answers.json ]; then cp review-in/answers.json "$DIR/review/answers.json"; fi
            # The helper models' verdicts, kept with the saved ones for every later run.
            if [ -n "$JUDGE_SAVE" ] && [ -f review-in/judge.json ]; then cp review-in/judge.json "$DIR/review/judge-answers.json"; fi
          fi
          cd "$TMP"
          git add -A
          git commit -q -m "Result: $RESULT_DIR (run ${GITHUB_RUN_NUMBER})" || exit 0
          # Another run may have pushed meanwhile (for example a model comparison).
          for i in 1 2 3; do
            git push -q origin results && exit 0
            git pull -q --rebase origin results
          done
          exit 1

      # The results are in: the status page (watching the live file) runs its next check at
      # once instead of waiting up to ten minutes.
      - name: Tell the status page the results are saved
        if: always() && env.LIVE_FILE != ''
        run: |
          DRIVE_TOKEN=$(jq -r '.inputs.drive_token // ""' "$GITHUB_EVENT_PATH")
          [ -n "$DRIVE_TOKEN" ] && echo "::add-mask::$DRIVE_TOKEN"
          DRIVE_TOKEN="$DRIVE_TOKEN" python live.py mark saved --status status.json || true

      - name: Fail if the book is not finished
        if: inputs.compare_models == '' && inputs.text_check_models == '' && steps.convert.outputs.code != '0'
        env:
          CODE: ${{ steps.convert.outputs.code }}
        run: |
          case "$CODE" in
            3) echo "Paused: today's Gemini quota is used up. Progress is saved; run the same book again tomorrow." ;;
            5) echo "The pages left are with the helper's models on the user's computer; the free models take their share again in the next run (the Drive inbox runs the book again)." ;;
            6) echo "Some free readers are out for today: some pages wait for their second reading tomorrow; the next book can start with the readers left." ;;
            7) echo "The run stopped before its Drive token ran out, with quota left: the Drive inbox starts the next run at once." ;;
            2) echo "Some pages could not be read (see report.md). Run the same book again to retry them." ;;
            *) echo "The conversion failed (see the log above)." ;;
          esac
          exit 1
