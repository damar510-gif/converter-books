name: Convert Book to EPUB

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to the input file in the repository (leave empty if using file_url)'
        required: false
        type: string
      file_url:
        description: 'Direct download URL for the book file (optional)'
        required: false
        type: string
      title:
        description: 'Book title (optional, defaults to the file name)'
        required: false
        type: string
      pages:
        description: 'Pages to convert, e.g. 1-20 (empty = whole book)'
        required: false
        type: string
      model:
        description: 'Main Gemini model'
        required: false
        type: string
        default: 'gemini-3.5-flash-lite'
      fallback_model:
        description: 'Stronger model for pages the main one fails (small daily limit)'
        required: false
        type: string
        default: 'gemini-3.8-flash'
      compare_models:
        description: 'Testing only: compare these models (comma separated) on the given pages instead of converting'
        required: false
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc and Tesseract
        run: sudo apt-get update && sudo apt-get install -y pandoc tesseract-ocr tesseract-ocr-ara

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pick the book file
        env:
          FILE_URL: ${{ inputs.file_url }}
          INPUT_FILE: ${{ inputs.input_file }}
        run: |
          if [ -n "$FILE_URL" ]; then
            FILENAME=$(basename "${FILE_URL%%\?*}")
            if [[ ! "$FILENAME" =~ \.(pdf|docx|txt)$ ]]; then
              FILENAME="downloaded_book.pdf"
            fi
            wget -q -O "$FILENAME" "$FILE_URL"
            TARGET_FILE="$FILENAME"
          else
            TARGET_FILE="$INPUT_FILE"
          fi
          if [ -z "$TARGET_FILE" ] || [ ! -f "$TARGET_FILE" ]; then
            echo "Error: provide input_file (a file in the repository) or file_url."
            exit 1
          fi
          BASENAME=$(basename "$TARGET_FILE")
          {
            echo "TARGET_FILE=$TARGET_FILE"
            echo "EPUB_OUTPUT=${BASENAME%.*}.epub"
            echo "BOOK_HASH=$(sha256sum "$TARGET_FILE" | cut -c1-16)"
          } >> "$GITHUB_ENV"

      # Pages already read in earlier runs are kept here, so a run stopped by the
      # daily limit continues tomorrow from where it stopped.
      - name: Restore saved progress
        uses: actions/cache/restore@v4
        with:
          path: work
          key: ocr-${{ env.BOOK_HASH }}-${{ github.run_id }}
          restore-keys: ocr-${{ env.BOOK_HASH }}-

      - name: Compare models
        if: inputs.compare_models != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOOK_PAGES: ${{ inputs.pages }}
          MODELS: ${{ inputs.compare_models }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          python compare_models.py "$TARGET_FILE" --pages "$BOOK_PAGES" --models "$MODELS" --out compare-out
          cat compare-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TMP=$(mktemp -d)
          git clone -q --depth 1 --branch results "$URL" "$TMP"
          rm -rf "$TMP/compare" && mkdir -p "$TMP/compare" && cp compare-out/* "$TMP/compare/"
          cd "$TMP" && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Model comparison (run ${GITHUB_RUN_NUMBER})" && git push -q origin results

      - name: Run Conversion Script
        id: convert
        if: inputs.compare_models == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          GEMINI_FALLBACK_MODEL: ${{ inputs.fallback_model }}
          BOOK_TITLE: ${{ inputs.title }}
          BOOK_PAGES: ${{ inputs.pages }}
          PYTHONUNBUFFERED: '1'
        run: |
          set +e
          ARGS=(-o "$EPUB_OUTPUT" --work-dir work --report report.md --keep-markdown)
          [ -n "$BOOK_TITLE" ] && ARGS+=(--title "$BOOK_TITLE")
          [ -n "$BOOK_PAGES" ] && ARGS+=(--pages "$BOOK_PAGES")
          python converter.py "$TARGET_FILE" "${ARGS[@]}"
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Save progress
        if: always() && inputs.compare_models == ''
        uses: actions/cache/save@v4
        with:
          path: work
          key: ocr-${{ env.BOOK_HASH }}-${{ github.run_id }}

      - name: Upload EPUB Artifact
        if: always() && inputs.compare_models == ''
        uses: actions/upload-artifact@v4
        with:
          name: converted-epub
          path: |
            ${{ env.EPUB_OUTPUT }}
            ${{ env.EPUB_OUTPUT }}.md
            report.md
          if-no-files-found: warn

      # The book and its text are also kept in the "results" branch, so they can be
      # downloaded straight from the repository page.
      - name: Save to results branch
        if: always() && steps.convert.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$EPUB_OUTPUT" ] || exit 0
          NAME="${EPUB_OUTPUT%.epub}"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TMP=$(mktemp -d)
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git clone -q --depth 1 --branch results "$URL" "$TMP"
          else
            git init -q -b results "$TMP"
            git -C "$TMP" remote add origin "$URL"
          fi
          mkdir -p "$TMP/$NAME"
          cp "$EPUB_OUTPUT" "$TMP/$NAME/"
          [ -f "$EPUB_OUTPUT.md" ] && cp "$EPUB_OUTPUT.md" "$TMP/$NAME/text.md"
          cp report.md "$TMP/$NAME/report.md"
          cd "$TMP"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Result: $NAME (run ${GITHUB_RUN_NUMBER})" || exit 0
          git push -q origin results

      - name: Fail if pages are missing
        if: inputs.compare_models == '' && steps.convert.outputs.code != '0'
        run: |
          echo "The book is incomplete or the conversion failed (see report.md in the artifact). Run again to continue."
          exit 1
